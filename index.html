<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scout</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("isseaair_theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #08090a;
        --surface: #101113;
        --surface-2: #17181b;
        --surface-3: #1e2023;
        --border: #1f2124;
        --border-2: #2a2d31;
        --text: #f2f3f5;
        --text-2: #9a9ea6;
        --text-3: #5c6066;
        --fg: #ffffff;
        --fg-contrast: #000000;
        --green: #3ddc84;
        --green-dim: rgba(61, 220, 132, 0.12);
        --red: #f66;
        --red-dim: rgba(255, 102, 102, 0.12);
        --amber: #f5b34d;
        --ring: rgba(255, 255, 255, 0.14);
        --backdrop: rgba(0, 0, 0, 0.5);
        --r-xs: 5px;
        --r-sm: 8px;
        --r-md: 10px;
        --r-lg: 14px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      :root[data-theme="light"] {
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-2: #f3f3f4;
        --surface-3: #eaeaec;
        --border: #e7e7e9;
        --border-2: #d7d7db;
        --text: #16171a;
        --text-2: #5b5e64;
        --text-3: #96999f;
        --fg: #141518;
        --fg-contrast: #ffffff;
        --green: #159a4a;
        --green-dim: rgba(21, 154, 74, 0.1);
        --red: #dc3545;
        --red-dim: rgba(220, 53, 69, 0.1);
        --amber: #b3720a;
        --ring: rgba(0, 0, 0, 0.08);
        --backdrop: rgba(20, 20, 22, 0.28);
      }
      html {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Noto Sans KR", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        letter-spacing: -0.008em;
      }
      * {
        transition: background-color 0.18s ease, border-color 0.18s ease, color 0.15s ease;
      }
      button,
      input,
      textarea {
        font-family: inherit;
      }
      ::selection {
        background: rgba(128, 128, 128, 0.3);
      }

      /* ── TOOLTIP ─────────────────────────────────── */
      [data-tip] {
        position: relative;
      }
      [data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 7px);
        left: 50%;
        transform: translateX(-50%) translateY(3px);
        background: var(--surface-3);
        border: 1px solid var(--border-2);
        color: var(--text);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0;
        padding: 4px 8px;
        border-radius: 6px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease, transform 0.12s ease;
        z-index: 500;
      }
      [data-tip].tip-below::after {
        bottom: auto;
        top: calc(100% + 7px);
        transform: translateX(-50%) translateY(-3px);
      }
      [data-tip]:hover::after,
      [data-tip]:focus-visible::after {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── HEADER ─────────────────────────────────── */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: color-mix(in srgb, var(--bg) 85%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .header-in {
        max-width: 920px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 56px;
        padding: 0 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }
      .brand-icon {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        flex-shrink: 0;
        object-fit: cover;
        display: block;
      }

      .search {
        flex: 1;
        max-width: 280px;
        min-width: 70px;
        position: relative;
      }
      .search svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        pointer-events: none;
      }
      .search input {
        width: 100%;
        height: 30px;
        padding: 0 26px 0 30px;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        font-size: 12.5px;
        color: var(--text);
        background: var(--surface);
        outline: none;
        transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s;
      }
      .search input::placeholder {
        color: var(--text-3);
      }
      .search input:focus {
        border-color: var(--border-2);
        background: var(--surface-2);
        box-shadow: 0 0 0 3px var(--ring);
      }
      .search-clear {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%) scale(0.9);
        width: 18px;
        height: 18px;
        border: none;
        background: transparent;
        color: var(--text-3);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: 4px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease, color 0.12s ease;
      }
      .search-clear:hover {
        color: var(--text);
        background: var(--surface-3);
      }
      .search.has-value .search-clear {
        opacity: 1;
        pointer-events: all;
      }

      .hdr-group {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .hdr-sep {
        width: 1px;
        height: 18px;
        background: var(--border);
        margin: 0 6px;
        flex-shrink: 0;
      }
      .hdr-right {
        display: flex;
        align-items: center;
        margin-left: auto;
        flex-shrink: 0;
      }
      .sync {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 8px;
        height: 24px;
        border-radius: var(--r-xs);
        font-size: 10.5px;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .sync-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--text-3);
        transition: background 0.3s;
      }
      .sync-dot.ok {
        background: var(--green);
      }
      .sync-dot.err {
        background: var(--red);
      }
      .sync-dot.loading {
        background: var(--amber);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .iconbtn {
        position: relative;
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: var(--r-sm);
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
      }
      .iconbtn:hover {
        background: var(--surface-2);
        border-color: var(--border);
        color: var(--text);
      }
      .iconbtn:active {
        transform: scale(0.92);
      }
      .iconbtn.spin svg {
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .iconbtn-danger {
        color: var(--red);
      }
      .iconbtn-danger:hover {
        background: var(--red-dim);
        border-color: color-mix(in srgb, var(--red) 40%, transparent);
        color: var(--red);
      }
      .badge {
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 13px;
        height: 13px;
        padding: 0 3px;
        border-radius: 999px;
        background: var(--fg);
        color: var(--fg-contrast);
        font-size: 8.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      /* ── LAYOUT ──────────────────────────────────── */
      .shell {
        max-width: 920px;
        margin: 0 auto;
        padding: 26px 24px 96px;
      }

      /* ── COMPOSER ────────────────────────────────── */
      .composer {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 14px;
        margin-bottom: 26px;
        transition: border-color 0.15s var(--ease), background-color 0.18s ease;
      }
      .composer:focus-within {
        border-color: var(--border-2);
      }
      .composer textarea {
        width: 100%;
        min-height: 50px;
        max-height: 200px;
        resize: vertical;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: 11.5px;
        line-height: 1.65;
        letter-spacing: -0.006em;
        padding: 3px 3px 7px;
      }
      .composer textarea::placeholder {
        color: var(--text-3);
        font-family: inherit;
      }
      .composer-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 11px;
        border-top: 1px solid var(--border);
      }
      .composer-status {
        font-size: 11px;
        color: var(--text-3);
        margin-left: 2px;
        font-variant-numeric: tabular-nums;
      }

      /* ── BUTTONS ─────────────────────────────────── */
      .btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid transparent;
        border-radius: var(--r-sm);
        font-size: 12.5px;
        font-weight: 500;
        padding: 7px 13px;
        cursor: pointer;
        transition: background 0.15s var(--ease), color 0.15s, border-color 0.15s, transform 0.1s;
        line-height: 1.2;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--fg);
        color: var(--fg-contrast);
      }
      .btn-primary:hover {
        opacity: 0.85;
      }
      .btn-primary:disabled {
        opacity: 0.35;
        cursor: default;
        transform: none;
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-2);
        border-color: var(--border);
      }
      .btn-ghost:hover {
        background: var(--surface-2);
        border-color: var(--border-2);
        color: var(--text);
      }
      .btn-sm {
        padding: 5px 11px;
        font-size: 11.5px;
        border-radius: var(--r-xs);
      }
      .btn:focus-visible,
      .iconbtn:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }

      /* ── STATUS TABS ─────────────────────────────── */
      .status-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .status-tab {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        padding: 8px 12px;
        cursor: pointer;
        transition: border-color 0.15s var(--ease), background-color 0.18s ease;
      }
      .status-tab:hover {
        border-color: var(--border-2);
      }
      .status-tab.active {
        background: var(--surface-3);
        border-color: var(--border-2);
      }
      .status-tab.active::after {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 0;
        height: 2px;
        border-radius: 2px 2px 0 0;
        background: var(--text);
      }
      .status-tab b {
        font-size: 17px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .status-tab span {
        font-size: 10px;
        color: var(--text-3);
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .status-tab.active span {
        color: var(--text-2);
      }
      .status-tab[data-status="done"] b {
        color: var(--green);
      }
      .status-tab[data-status="reject"] b {
        color: var(--red);
      }

      /* ── DATE CHIPS ──────────────────────────────── */
      .date-chip-bar {
        display: none;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        margin-bottom: 20px;
      }
      .date-chip-bar::-webkit-scrollbar {
        display: none;
      }
      .date-chip {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-3);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.12s var(--ease);
      }
      .date-chip:hover {
        color: var(--text-2);
        border-color: var(--border-2);
      }
      .date-chip.active {
        background: var(--fg);
        border-color: var(--fg);
        color: var(--fg-contrast);
        font-weight: 600;
      }
      .date-chip b {
        font-weight: 600;
        opacity: 0.55;
      }
      .date-chip.active b {
        opacity: 0.55;
      }

      /* ── BUCKET PANEL ────────────────────────────── */
      .bucket-panel {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        padding: 10px 10px 10px 16px;
        margin-bottom: 18px;
      }
      .bucket-panel strong {
        font-size: 12.5px;
        font-weight: 600;
      }
      .bucket-panel span {
        font-size: 11.5px;
        color: var(--text-3);
        margin-left: 4px;
        font-variant-numeric: tabular-nums;
      }
      .bucket-actions {
        display: flex;
        gap: 2px;
      }

      /* ── GRID / DIVIDER ──────────────────────────── */
      .scan-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(266px, 1fr));
        gap: 10px;
      }
      .divider {
        grid-column: 1 / -1;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 18px 2px 8px;
      }
      .divider:first-child {
        padding-top: 0;
      }
      .divider-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        font-family: inherit;
        transition: color 0.12s;
      }
      .divider-label:hover {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .divider-count {
        font-size: 11px;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }

      /* ── CARD ────────────────────────────────────── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 2px solid var(--border);
        border-radius: var(--r-md);
        padding: 13px 14px;
        display: flex;
        flex-direction: column;
        gap: 9px;
        animation: cardIn 0.22s var(--ease) both;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card:hover {
        border-color: var(--border-2);
        background: var(--surface-2);
      }
      .card.status-done {
        border-left-color: var(--green);
      }
      .card.status-reject {
        border-left-color: var(--red);
      }
      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .card-title {
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.45;
        letter-spacing: -0.008em;
        color: var(--text);
      }
      .card-title.is-empty {
        color: var(--text-3);
        font-weight: 500;
        font-style: italic;
      }
      .card-time-group {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .flag-wrap {
        display: flex;
        cursor: default;
      }
      .card-time {
        flex-shrink: 0;
        font-size: 10.5px;
        color: var(--text-3);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        cursor: default;
      }
      .senior-flag {
        display: inline-block;
        font-size: 10px;
        color: var(--red);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      .meta-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text-2);
        max-width: 100%;
        min-width: 0;
      }
      .meta-item svg {
        flex-shrink: 0;
        color: var(--text-3);
      }
      .flag-svg {
        flex-shrink: 0;
        display: block;
        border-radius: 2px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      }
      .meta-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-note {
        border-top: 1px dashed transparent;
      }
      .card-note.has-note {
        border-top-color: var(--border);
        padding-top: 6px;
      }
      .note-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .note-toggle {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: none;
        background: transparent;
        color: var(--text-3);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: color 0.12s, background 0.12s;
      }
      .note-toggle:hover {
        background: var(--surface-3);
        color: var(--text-2);
      }
      .has-note .note-toggle {
        color: var(--amber);
      }
      .note-preview {
        font-size: 11.5px;
        color: var(--text-2);
        font-style: italic;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }
      .note-editor {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.18s var(--ease);
      }
      .card-note.open .note-editor {
        grid-template-rows: 1fr;
        margin-top: 6px;
      }
      .note-editor-inner {
        overflow: hidden;
      }
      .note-editor textarea {
        width: 100%;
        min-height: 46px;
        resize: none;
        border: 1px solid var(--border-2);
        border-radius: var(--r-xs);
        background: var(--bg);
        color: var(--text);
        font-size: 11.5px;
        line-height: 1.5;
        padding: 6px 8px;
        outline: none;
      }
      .note-editor textarea:focus {
        border-color: var(--text-3);
      }
      .card-note.open .note-preview {
        display: none;
      }

      .card-foot {
        display: flex;
        gap: 6px;
        margin-top: 2px;
      }
      .card-act {
        position: relative;
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 26px;
        border-radius: var(--r-xs);
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-2);
        text-decoration: none;
        cursor: pointer;
        transition: all 0.12s var(--ease);
      }
      .card-act:hover {
        background: var(--surface-3);
        border-color: var(--border-2);
        color: var(--text);
      }
      .card-act[data-act="reject"].active {
        background: var(--red-dim);
        border-color: color-mix(in srgb, var(--red) 35%, transparent);
        color: var(--red);
      }
      .card-act[data-act="done"].active {
        background: var(--green-dim);
        border-color: color-mix(in srgb, var(--green) 35%, transparent);
        color: var(--green);
      }
      .card-act[data-act="del"]:hover {
        background: var(--red-dim);
        border-color: color-mix(in srgb, var(--red) 35%, transparent);
        color: var(--red);
      }
      .card-act:disabled {
        opacity: 0.3;
        cursor: default;
      }

      /* ── EMPTY / SENTINEL ────────────────────────── */
      .empty-state {
        display: none;
        text-align: center;
        padding: 64px 20px;
      }
      .empty-title {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-3);
      }
      .sentinel {
        height: 1px;
      }

      /* ── SLIDE-OVER PANEL ─────────────────────────── */
      .panel-backdrop {
        position: fixed;
        inset: 0;
        background: var(--backdrop);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s var(--ease);
        z-index: 250;
      }
      .panel-backdrop.open {
        opacity: 1;
        pointer-events: all;
      }
      .panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 360px;
        max-width: 92vw;
        background: var(--surface);
        border-left: 1px solid var(--border);
        z-index: 260;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.25s var(--ease);
        box-shadow: -20px 0 50px rgba(0, 0, 0, 0.25);
      }
      .panel.open {
        transform: none;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .panel-head span {
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }
      .pane {
        display: none;
      }
      .pane.active {
        display: block;
        animation: cardIn 0.2s var(--ease) both;
      }
      .pane-cap {
        font-size: 11.5px;
        color: var(--text-3);
        margin-bottom: 14px;
        line-height: 1.6;
      }
      .field-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .field {
        flex: 1;
        min-width: 0;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: var(--r-xs);
        font-size: 12px;
        color: var(--text);
        background: var(--bg);
        outline: none;
        transition: border-color 0.12s;
      }
      .field:focus {
        border-color: var(--border-2);
      }
      .field::placeholder {
        color: var(--text-3);
      }
      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 6px 3px 10px;
        border-radius: 999px;
        background: var(--red-dim);
        color: var(--red);
        border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
        font-size: 11.5px;
        font-weight: 500;
      }
      .tag button {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: none;
        background: color-mix(in srgb, var(--red) 20%, transparent);
        color: var(--red);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        line-height: 1;
        padding: 0;
      }
      .tag button:hover {
        background: var(--red);
        color: var(--fg-contrast);
      }
      .tag-empty {
        font-size: 11.5px;
        color: var(--text-3);
      }
      .bkmk-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .bkmk-btn {
        display: inline-flex;
        align-items: center;
        padding: 6px 13px;
        border-radius: var(--r-xs);
        background: var(--surface-3);
        color: var(--text);
        border: 1px solid var(--border-2);
        font-size: 11.5px;
        font-weight: 500;
        text-decoration: none;
        cursor: grab;
        user-select: none;
        transition: background 0.12s;
      }
      .bkmk-btn:hover {
        background: var(--surface-2);
        border-color: var(--text-3);
      }
      .extract-out {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--r-xs);
        padding: 8px 10px;
        font-size: 11px;
        color: var(--text-2);
        max-height: 180px;
        overflow-y: auto;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        margin-top: 8px;
      }
      .row-actions {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* ── TOAST ───────────────────────────────────── */
      .toast-wrap {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 900;
        pointer-events: none;
      }
      .toast {
        background: color-mix(in srgb, var(--surface-2) 92%, transparent);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border-2);
        color: var(--text);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 500;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        opacity: 0;
        transform: translateY(6px) scale(0.98);
        transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      .toast.warn {
        background: var(--red);
        border-color: var(--red);
        color: #1a0000;
      }
      .toast.ok {
        background: var(--green);
        border-color: var(--green);
        color: #002611;
      }

      /* ── RESPONSIVE ──────────────────────────────── */
      @media (max-width: 640px) {
        .header-in {
          padding: 0 16px;
          gap: 8px;
        }
        .search {
          max-width: none;
        }
        .hdr-sep {
          margin: 0 2px;
        }
        .shell {
          padding: 18px 16px 90px;
        }
        .status-tab b {
          font-size: 15px;
        }
        .scan-grid {
          grid-template-columns: 1fr;
        }
        .panel {
          width: 100%;
          max-width: 100%;
        }
        .lock-box {
          width: 88vw;
          padding: 34px 26px 30px;
        }
        .pin-keypad {
          grid-template-columns: repeat(3, 62px);
          gap: 8px;
        }
        .pin-key {
          height: 46px;
        }
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-2);
        border-radius: 99px;
      }

      /* ── LOCK SCREEN (always dark, brand-fixed) ───── */
      .lock-screen {
        --bg: #000;
        --surface: #101113;
        --surface-2: #17181b;
        --surface-3: #1e2023;
        --border: #1f2124;
        --border-2: #2a2d31;
        --text: #f2f3f5;
        --text-2: #9a9ea6;
        --text-3: #5c6066;
        --fg: #ffffff;
        --fg-contrast: #000000;
        --red: #f66;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lock-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 42px 36px 36px;
        width: 300px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .lock-logo {
        width: 52px;
        height: 52px;
        border-radius: 13px;
        object-fit: cover;
      }
      .pin-dots {
        display: flex;
        gap: 13px;
        margin: 2px 0;
      }
      .pin-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        border: 1.5px solid var(--border-2);
        background: transparent;
        transition: all 0.15s var(--ease);
      }
      .pin-dot.filled {
        background: var(--fg);
        border-color: var(--fg);
        transform: scale(1.1);
      }
      .pin-dot.error {
        background: var(--red);
        border-color: var(--red);
      }
      .pin-keypad {
        display: grid;
        grid-template-columns: repeat(3, 68px);
        gap: 9px;
      }
      .pin-key {
        height: 50px;
        border-radius: var(--r-sm);
        border: 1px solid var(--border);
        background: var(--surface-2);
        font-size: 17px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        transition: all 0.1s var(--ease);
      }
      .pin-key:hover {
        background: var(--surface-3);
        border-color: var(--border-2);
      }
      .pin-key:active {
        transform: scale(0.95);
      }
      .pin-key.del {
        font-size: 13px;
        color: var(--text-3);
      }
      .lock-error {
        font-size: 11.5px;
        color: var(--red);
        height: 14px;
      }
    </style>
  </head>
  <body>
    <!-- ── LOCK SCREEN ───────────────────────────────────── -->

                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />

    <div class="shell">

            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3" /><path d="M14 8h5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-5" /></svg>

    <!-- ── SLIDE-OVER PANEL (Blocklist / Bookmarklets / Extract) ── -->
    <div class="panel-backdrop" id="panelBackdrop" onclick="closePanel()"></div>

        <button class="iconbtn" data-tip="Close" onclick="closePanel()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="panel-body">
        <div class="pane" id="paneBlocklist">
          <div class="pane-cap">Auto-rejects matching manufacturers</div>
          <div class="field-row">
            <input id="blockedInput" class="field" type="text" placeholder="Company name" />
            <button class="iconbtn" id="blockedAddBtn" data-tip="Add" style="border:1px solid var(--border)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>

          <div class="pane-cap">Drag to bookmarks bar · run on SSG pages</div>

          </div>

          <div class="field-row">
            <input id="extractUrlInput" class="field" type="text" placeholder="Search results URL" />

              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </button>

          <div class="row-actions">
            <span id="extractStatus" style="font-size:11.5px;color:var(--text-3)"></span>

              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>

    <div class="toast-wrap"><div class="toast" id="toast"></div></div>

    <script>
      /* ══════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════ */
      /* ── Google Apps Script 배포 ────────────────────────────
   확장 프로그램 → Apps Script → 코드 붙여넣기 → 배포(웹앱, 나/모든 사용자) → URL을 APPS_SCRIPT_URL에 설정

   function doGet(e) {
     if (e.parameter.action === 'scrape') return scrapeProduct(e.parameter.url);
     if (e.parameter.action === 'extractLinks') return extractLinks(e.parameter.url);
     if (e.parameter.action === 'saveToEmart') return saveToEmart(e.parameter);
     if (e.parameter.action === 'getEmartItems') return getEmartItems();
     if (e.parameter.action === 'updateEmartStatus') return updateEmartStatus(e.parameter);
     return res({success:false, error:'알 수 없는 요청'});
   }
   function saveToEmart(p) {
     try {
       const ss = SpreadsheetApp.getActiveSpreadsheet();
       let sheet = ss.getSheetByName('emart');
       if (!sheet) sheet = ss.insertSheet('emart');
       if (sheet.getLastRow() === 0) {
         sheet.appendRow(['URL', '품명', '제조사/수입자', '제조국', '전화번호', '스캔일시', '상태']);
         sheet.getRange(1,1,1,7).setFontWeight('bold').setBackground('#f1f5f9');
       }
       sheet.appendRow([p.url||'', p['품명']||'', p['제조사수입자']||'', p['제조국']||'', p['전화번호']||'', p.addedAt||'', '']);
       return res({success: true});
     } catch(e) { return res({success: false, error: e.message}); }
   }
   function getEmartItems() {
     try {
       const ss = SpreadsheetApp.getActiveSpreadsheet();
       const sheet = ss.getSheetByName('emart');
       if (!sheet || sheet.getLastRow() < 2) return res({success: true, items: []});
       const cols = Math.max(sheet.getLastColumn(), 7);
       const rows = sheet.getRange(2, 1, sheet.getLastRow()-1, cols).getValues();
       const items = rows.map(r => ({
         url: r[0]||'', 품명: r[1]||'', 제조사수입자: r[2]||'', 제조국: r[3]||'', 전화번호: r[4]||'', addedAt: r[5]||'', scanStatus: r[6]||''
       })).filter(i => i.url);
       return res({success: true, items});
     } catch(e) { return res({success: false, error: e.message}); }
   }
   function updateEmartStatus(p) {
     try {
       const ss = SpreadsheetApp.getActiveSpreadsheet();
       const sheet = ss.getSheetByName('emart');
       if (!sheet || sheet.getLastRow() < 2) return res({success: false, error: 'emart 시트 없음'});
       const urls = sheet.getRange(2, 1, sheet.getLastRow()-1, 1).getValues();
       let found = -1;
       for (let i = 0; i < urls.length; i++) { if (urls[i][0] === p.url) { found = i+2; break; } }
       if (found < 0) return res({success: false, error: '행을 찾지 못함'});
       if (sheet.getLastColumn() < 7) sheet.getRange(1,7).setValue('상태');
       sheet.getRange(found, 7).setValue(p.status || '');
       return res({success: true});
     } catch(e) { return res({success: false, error: e.message}); }
   }
   function extractLinks(url) {
     try {
       const html = UrlFetchApp.fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0', 'Accept-Language': 'ko-KR,ko;q=0.9' }, muteHttpExceptions: true, followRedirects: true }).getContentText('UTF-8');
       const ndm = html.match(/<script id="__NEXT_DATA__" type="application\/json">([^<]+)<\/script>/);
       if (ndm) {
         const jsonStr = ndm[1]; const seen = new Set(); const links = [];
         const itemRe = /"itemId":"(\d+)"/g; let m;
         while ((m = itemRe.exec(jsonStr)) !== null) {
           const itemId = m[1]; if (seen.has(itemId)) continue; seen.add(itemId);
           const chunk = jsonStr.substring(Math.max(0, m.index - 100), m.index + 200);
           const snm = chunk.match(/"siteNo":"(\d+)"/); const siteNo = snm ? snm[1] : '6001';

      function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
      function bucketOf(iso) {
        const d = iso ? new Date(iso) : new Date();
        if (isNaN(d.getTime())) return { key: "unknown", label: "—", rank: 9999 };
        const diff = Math.round((dayStart(new Date()) - dayStart(d)) / 86400000);
        if (diff <= 0) return { key: "d0", label: "Today", rank: 0 };
        if (diff === 1) return { key: "d1", label: "Yesterday", rank: 1 };
        if (diff < 7) return { key: "d" + diff, label: diff + "d", rank: diff };
        if (diff < 30) { const w = Math.floor(diff / 7); return { key: "w" + w, label: w + "w", rank: 8 + w }; }
        const m = Math.floor(diff / 30);
        if (m < 12) return { key: "m" + m, label: m + "mo", rank: 100 + m };
        const y = Math.floor(m / 12);
        return { key: "y" + y, label: y + "y", rank: 1000 + y };

      function cardHTML(item) {

              ${flag ? `<span class="flag-wrap" title="${esc(item.제조국)}">${flag}</span>` : ""}

          </div>

            <div class="note-editor"><div class="note-editor-inner">
              <textarea placeholder="Note" oninput="onNoteInput(this,'${urlEnc}')">${esc(note)}</textarea>

      function syncCardButtons(item) {
        const url = item.url || "";
        const card = document.querySelector(`.card[data-url="${CSS.escape(url)}"]`);
        if (!card) return;
        const senior = isSeniorCompany(item);
        const st = senior ? "reject" : statusOf(item);
        card.className = "card status-" + st;
        const rejectBtn = card.querySelector('[data-act="reject"]');
        const doneBtn = card.querySelector('[data-act="done"]');
        rejectBtn.classList.toggle("active", st === "reject" && !senior);
        doneBtn.classList.toggle("active", st === "done");

      function dividerHTML(b, count) {
        return `<div class="divider"><button class="divider-label" onclick="setBucket('${esc(b.key)}')">${esc(b.label)}</button><span class="divider-count">${count}</span></div>`;
      }

      function toEl(html) {
        const t = document.createElement("template");
        t.innerHTML = html.trim();
        return t.content.firstElementChild;
      }

      function renderMore() {
        const container = document.getElementById("scanResults");
        const list = renderCtl.list;
        const start = renderCtl.shown;
        const end = Math.min(start + renderCtl.batch, list.length);
        if (start >= end) return;

        const frag = document.createDocumentFragment();
        for (let idx = start; idx < end; idx++) {
          const item = list[idx];
          const b = bucketOf(item.addedAt);
          if (!state.bucket && b.key !== renderCtl.lastBucketKey) {
            const count = list.filter((x) => bucketOf(x.addedAt).key === b.key).length;
            frag.appendChild(toEl(dividerHTML(b, count)));
            renderCtl.lastBucketKey = b.key;
          }
          frag.appendChild(toEl(cardHTML(item)));
        }
        container.appendChild(frag);
        renderCtl.shown = end;
      }

      function resetRender() {
        renderChips();
        renderStatusTabs();
        const list = finalList().slice().sort((a, b) => (b.addedAt || "").localeCompare(a.addedAt || ""));
        renderCtl.list = list;
        renderCtl.shown = 0;
        renderCtl.lastBucketKey = null;

        renderBucketPanel(list);

        const container = document.getElementById("scanResults");
        const empty = document.getElementById("emptyState");
        container.innerHTML = "";

        if (!scannedItems.length) {
          container.style.display = "none";
          empty.style.display = "block";
          document.getElementById("emptyTitle").textContent = "No items";
          return;
        }
        if (!list.length) {
          container.style.display = "none";
          empty.style.display = "block";
          document.getElementById("emptyTitle").textContent = "No results";
          return;
        }
        container.style.display = "grid";
        empty.style.display = "none";
        renderMore();
      }

      function setBucket(key) {
        state.bucket = state.bucket === key ? null : key || null;
        resetRender();
      }

      function copyCurrentList() {
        const items = renderCtl.list;
        if (!items.length) { showToast("Nothing to copy", "warn"); return; }
        const lines = items.map((i) => [i.품명 || "", i.제조사수입자 || "", i.전화번호 || ""].join("\t"));
        navigator.clipboard
          .writeText(lines.join("\n"))
          .then(() => showToast(`Copied ${items.length}`, "ok"))
          .catch(() => showToast("Copy failed", "warn"));
      }

      /* ── 메모 ────────────────────────────────────────── */
      function toggleNote(btn) {
        const wrap = btn.closest(".card-note");
        wrap.classList.toggle("open");
        if (wrap.classList.contains("open")) {
          const ta = wrap.querySelector("textarea");
          ta.focus();
          const v = ta.value;
          ta.setSelectionRange(v.length, v.length);
        }
      }
      let _noteTimers = {};
      function onNoteInput(ta, url) {
        clearTimeout(_noteTimers[url]);
        const val = ta.value;
        _noteTimers[url] = setTimeout(() => {
          setNote(url, val.trim());
          const wrap = ta.closest(".card-note");
          wrap.classList.toggle("has-note", !!val.trim());
          wrap.querySelector(".note-preview").textContent = val.trim();
        }, 350);
      }

      /* ══════════════════════════════════════════════════════
   SCAN — 상품 분석
   ══════════════════════════════════════════════════════ */
      function normPhone(p) {
        if (!p) return "";
        const digits = String(p).replace(/[^0-9]/g, "");
        if (digits.length >= 7) return digits;
        return String(p).replace(/[\s\-().]/g, "").toLowerCase();
      }
      function normMfr(n) { return n ? String(n).trim().replace(/\s+/g, " ").toLowerCase() : ""; }
      function isDuplicate(item, list) {
        const phone = normPhone(item.전화번호);
        const mfr = normMfr(item.제조사수입자);
        return list.some((x) => {
          if (phone && phone.length >= 7 && normPhone(x.전화번호) === phone) return true;
          if (mfr && normMfr(x.제조사수입자) === mfr) return true;
          return false;
        });
      }
      function deduplicateExisting() {
        const before = scannedItems.length;
        const deduped = [];
        scannedItems.forEach((item) => { if (!isDuplicate(item, deduped)) deduped.push(item); });
        scannedItems = deduped;
        saveScan();
        resetRender();
        const removed = before - scannedItems.length;
        showToast(removed > 0 ? `Removed ${removed} duplicate${removed === 1 ? "" : "s"}` : "No duplicates", removed > 0 ? "ok" : "");
      }

      async function runScan() {
        const ta = document.getElementById("scanUrlInput");
        const urls = ta.value.split("\n").map((u) => u.trim()).filter((u) => /^https?:\/\//.test(u));
        if (!urls.length) { showToast("Enter a URL", "warn"); return; }
        if (!APPS_SCRIPT_URL) { showToast("APPS_SCRIPT_URL not set", "warn"); return; }

        const btn = document.getElementById("scanBtn");
        const prog = document.getElementById("scanProgress");
        btn.disabled = true;
        let ok = 0, fail = 0, dup = 0;

        for (let i = 0; i < urls.length; i++) {
          const url = urls[i];
          prog.textContent = `${i + 1}/${urls.length}`;
          try {
            const api = new URL(APPS_SCRIPT_URL);
            api.searchParams.set("action", "scrape");
            api.searchParams.set("url", url);
            const res = await fetch(api.toString());
            const json = await res.json();
            if (json.success && json.data) {
              const item = { ...json.data, url, addedAt: new Date().toISOString(), scanStatus: "" };
              if (scannedItems.some((x) => x.url === url) || isDuplicate(item, scannedItems)) { dup++; continue; }
              scannedItems.push(item);
              saveItemToSheet(item);
              ok++;
            } else {
              fail++;
            }
          } catch (e) {
            fail++;
          }
        }

        saveScan();
        ta.value = "";
        prog.textContent = ok || dup || fail ? `+${ok}${dup ? ` · dup ${dup}` : ""}${fail ? ` · fail ${fail}` : ""}` : "";
        btn.disabled = false;
        state.bucket = null;
        resetRender();
      }

      async function setScanStatus(url, newStatus) {
        const item = scannedItems.find((x) => x.url === url);
        if (!item) return;
        item.scanStatus = item.scanStatus === newStatus ? "" : newStatus;
        saveScan();
        syncCardButtons(item);
        renderStatusTabs();
        if (state.status !== "all" && statusOf(item) !== state.status) resetRender();
        if (!APPS_SCRIPT_URL) return;
        try {
          const api = new URL(APPS_SCRIPT_URL);
          api.searchParams.set("action", "updateEmartStatus");
          api.searchParams.set("url", url);
          api.searchParams.set("status", item.scanStatus);
          await fetch(api.toString());
        } catch (e) {}
      }

      async function saveItemToSheet(item) {
        if (!APPS_SCRIPT_URL) return;
        try {
          const api = new URL(APPS_SCRIPT_URL);
          api.searchParams.set("action", "saveToEmart");
          api.searchParams.set("url", item.url || "");
          api.searchParams.set("품명", item.품명 || "");
          api.searchParams.set("제조사수입자", item.제조사수입자 || "");
          api.searchParams.set("제조국", item.제조국 || "");
          api.searchParams.set("전화번호", item.전화번호 || "");
          api.searchParams.set("addedAt", item.addedAt || "");
          await fetch(api.toString());
        } catch (e) {}
      }

      function deleteScanItem(url) {
        scannedItems = scannedItems.filter((i) => i.url !== url);
        setNote(url, "");
        saveScan();
        resetRender();
      }
      function clearAllScan() {
        if (!confirm(`Delete ${scannedItems.length} items?`)) return;
        scannedItems = [];
        saveScan();
        state.bucket = null;
        resetRender();
      }

      async function loadEmartItems() {
        if (!APPS_SCRIPT_URL) return { added: 0, statusUpdated: 0 };
        const url = new URL(APPS_SCRIPT_URL);
        url.searchParams.set("action", "getEmartItems");
        const res = await fetch(url.toString());
        const json = await res.json();
        if (!json.success) throw new Error(json.error || "load failed");
        let added = 0, statusUpdated = 0;
        (json.items || []).forEach((sheetItem) => {
          const existing = scannedItems.find((x) => x.url === sheetItem.url);
          if (existing) {
            if (sheetItem.scanStatus && existing.scanStatus !== sheetItem.scanStatus) { existing.scanStatus = sheetItem.scanStatus; statusUpdated++; }
          } else if (!isDuplicate(sheetItem, scannedItems)) {
            scannedItems.push({ ...sheetItem, scanStatus: sheetItem.scanStatus || "" });
            added++;
          }
        });
        if (added || statusUpdated) saveScan();
        return { added, statusUpdated };
      }

      async function refreshFromSheet() {
        const btn = document.getElementById("refreshBtn");
        setSyncState("loading", "Syncing");
        btn.classList.add("spin");
        try {
          const { added, statusUpdated } = await loadEmartItems();
          resetRender();
          const now = new Date();
          setSyncState("ok", `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`);
          if (added || statusUpdated) showToast(`+${added} new · ${statusUpdated} updated`, "ok");
        } catch (e) {
          setSyncState("err", "Error");
        } finally {
          btn.classList.remove("spin");
        }
      }
      function setSyncState(st, txt) {
        document.getElementById("syncDot").className = "sync-dot" + (st ? " " + st : "");
        document.getElementById("syncText").textContent = txt;
      }

      /* ══════════════════════════════════════════════════════
   SLIDE-OVER PANEL
   ══════════════════════════════════════════════════════ */
      function openPanel(key, title) {
        document.querySelectorAll(".pane").forEach((p) => p.classList.remove("active"));
        document.getElementById("pane" + key).classList.add("active");
        document.getElementById("panelTitle").textContent = title;
        document.getElementById("panel").classList.add("open");
        document.getElementById("panelBackdrop").classList.add("open");
      }
      function closePanel() {
        document.getElementById("panel").classList.remove("open");
        document.getElementById("panelBackdrop").classList.remove("open");
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePanel();
      });

      /* ══════════════════════════════════════════════════════
   THEME
   ══════════════════════════════════════════════════════ */
      function updateThemeIcon() {
        const isLight = document.documentElement.getAttribute("data-theme") === "light";
        document.getElementById("themeBtn").innerHTML = isLight ? ICON.moon : ICON.sun;
      }
      function toggleTheme() {
        const isLight = document.documentElement.getAttribute("data-theme") === "light";
        if (isLight) document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", "light");
        localStorage.setItem("isseaair_theme", isLight ? "dark" : "light");
        updateThemeIcon();
      }
      updateThemeIcon();

      /* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
      function esc(s) {
        return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      let _toastT;
      function showToast(msg, type = "") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "toast" + (type ? " " + type : "");
        requestAnimationFrame(() => el.classList.add("show"));
        clearTimeout(_toastT);
        _toastT = setTimeout(() => el.classList.remove("show"), 2600);
      }

      /* ══════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════ */
      const searchWrap = document.getElementById("searchWrap");
      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", (e) => {
        state.search = e.target.value;
        searchWrap.classList.toggle("has-value", !!e.target.value);
        resetRender();
      });
      document.getElementById("searchClear").addEventListener("click", () => {
        searchInput.value = "";
        state.search = "";
        searchWrap.classList.remove("has-value");
        resetRender();
        searchInput.focus();
      });

      document.getElementById("refreshBtn").addEventListener("click", refreshFromSheet);
      document.getElementById("scanBtn").addEventListener("click", runScan);
      document.getElementById("dedupScanBtn").addEventListener("click", deduplicateExisting);
      document.getElementById("clearScanBtn").addEventListener("click", clearAllScan);
      document.getElementById("blockedAddBtn").addEventListener("click", addBlocked);
      document.getElementById("blockedInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.isComposing) addBlocked();
      });
      document.getElementById("statusTabs").addEventListener("click", (e) => {
        const btn = e.target.closest(".status-tab");
        if (!btn) return;
        state.status = btn.dataset.status;
        resetRender();
      });
      document.getElementById("dateChips").addEventListener("click", (e) => {
        const btn = e.target.closest(".date-chip");
        if (!btn) return;
        setBucket(btn.dataset.bucket || null);
      });

      const sentinelObserver = new IntersectionObserver(
        (entries) => {
          if (!entries[0].isIntersecting || renderCtl.loading) return;
          if (renderCtl.shown >= renderCtl.list.length) return;
          renderCtl.loading = true;
          requestAnimationFrame(() => {
            renderMore();
            renderCtl.loading = false;
          });
        },
        { rootMargin: "600px 0px" }
      );
      sentinelObserver.observe(document.getElementById("scrollSentinel"));

      /* ── 링크 추출기 ─────────────────────────────── */
      async function runExtract() {
        const url = document.getElementById("extractUrlInput").value.trim();
        if (!url) return;
        const statusEl = document.getElementById("extractStatus");
        const resultEl = document.getElementById("extractResult");
        const copyBtn = document.getElementById("extractCopyBtn");
        const toScanBtn = document.getElementById("extractToScanBtn");
        statusEl.textContent = "Extracting…";
        resultEl.style.display = "none";
        copyBtn.style.display = "none";
        toScanBtn.style.display = "none";
        try {
          const api = new URL(APPS_SCRIPT_URL);
          api.searchParams.set("action", "extractLinks");
          api.searchParams.set("url", url);
          const res = await fetch(api.toString());
          const json = await res.json();
          if (!json.success) throw new Error(json.error || "failed");
          const links = json.links;
          if (!links.length) { statusEl.textContent = "No results"; return; }
          statusEl.textContent = `${links.length} links`;
          resultEl.textContent = links.join("\n");
          resultEl.style.display = "block";
          copyBtn.style.display = "";
          toScanBtn.style.display = "";
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(links.join("\n"));
            showToast("Copied", "ok");
          };
          toScanBtn.onclick = () => {
            const ta = document.getElementById("scanUrlInput");
            const existing = ta.value.trim();
            ta.value = (existing ? existing + "\n" : "") + links.join("\n");
            closePanel();
            showToast(`${links.length} added`);
          };
        } catch (e) {
          statusEl.textContent = "Error";
        }
      }
      document.getElementById("extractBtn").addEventListener("click", runExtract);

      /* ══════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════ */
      renderBlockedTags();
      resetRender();
      refreshFromSheet();

      /* ── LOCK SCREEN ─────────────────────────────────── */
      (() => {
        const CORRECT = "1111";
        const lock = document.getElementById("lockScreen");
        if (sessionStorage.getItem("unlocked") === "1") { lock.style.display = "none"; return; }
        let pin = "";
        const dots = [0, 1, 2, 3].map((i) => document.getElementById("d" + i));
        const errEl = document.getElementById("lockError");
        function updateDots() {
          dots.forEach((d, i) => { d.classList.toggle("filled", i < pin.length); d.classList.remove("error"); });
          errEl.textContent = "";
        }
        function shake() {
          dots.forEach((d) => d.classList.add("error"));
          errEl.textContent = "Incorrect PIN";
          setTimeout(() => { pin = ""; updateDots(); }, 700);
        }
        function submit() {
          if (pin === CORRECT) { sessionStorage.setItem("unlocked", "1"); lock.style.display = "none"; }
          else shake();
        }
        document.querySelectorAll(".pin-key").forEach((btn) => {
          btn.addEventListener("click", () => {
            const k = btn.dataset.k;
            if (k === "del") { pin = pin.slice(0, -1); updateDots(); return; }
            if (k === "" || pin.length >= 4) return;
            pin += k; updateDots();
            if (pin.length === 4) submit();
          });
        });
        document.addEventListener("keydown", (e) => {
          if (lock.style.display === "none") return;
          if (e.key >= "0" && e.key <= "9" && pin.length < 4) { pin += e.key; updateDots(); if (pin.length === 4) submit(); }
          else if (e.key === "Backspace") { pin = pin.slice(0, -1); updateDots(); }
        });
      })();

      // 북마클릿 href 동적 생성
      (() => {
        const S = encodeURIComponent(APPS_SCRIPT_URL);

var S=decodeURIComponent('${S}');
function fld(ks){var rs=document.querySelectorAll('tr');for(var i=0;i<rs.length;i++){var th=rs[i].querySelector('th');var td=rs[i].querySelector('td');if(!th||!td)continue;var t=th.textContent.trim();for(var j=0;j<ks.length;j++){if(t.indexOf(ks[j])>=0)return td.textContent.replace(/\s+/g,' ').trim();}}return '';}
