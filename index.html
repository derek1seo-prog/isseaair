<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영업 관리</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --primary-light: #eff6ff;
        --bg: #f1f5f9;
        --surface: #ffffff;
        --border: #e2e8f0;
        --text: #1e293b;
        --text-2: #64748b;
        --text-3: #94a3b8;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.07),
          0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.09),
          0 2px 6px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.13),
          0 4px 12px rgba(0, 0, 0, 0.07);
        --r: 12px;
        --r-sm: 8px;
        --r-pill: 999px;
      }
      html {
        font-family: "Noto Sans KR", sans-serif;
        font-size: 14px;
      }
      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── HEADER ─────────────────────────────────── */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        padding: 0 24px;
      }
      .header-top {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 60px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0;
      }
      .logo-icon {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        flex-shrink: 0;
        object-fit: cover;
      }
      .logo-text {
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
      }

      .search-wrap {
        flex: 1;
        max-width: 420px;
        position: relative;
      }
      .search-ico {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        pointer-events: none;
      }
      .search-input {
        width: 100%;
        height: 38px;
        padding: 0 12px 0 34px;
        border: 1.5px solid var(--border);
        border-radius: var(--r-pill);
        font-family: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .search-input::placeholder {
        color: var(--text-3);
      }
      .search-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14);
        background: #fff;
      }

      .hdr-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      /* view toggle */
      .view-toggle {
        display: flex;
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: var(--r-sm);
        padding: 2px;
        gap: 2px;
      }
      .view-btn {
        padding: 5px 10px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        background: transparent;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: all 0.15s;
      }
      .view-btn.active {
        background: var(--surface);
        color: var(--primary);
        box-shadow: var(--shadow-sm);
      }

      .sync-pill {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 11px;
        border-radius: var(--r-pill);
        border: 1.5px solid var(--border);
        background: var(--bg);
        font-size: 11px;
        color: var(--text-3);
        white-space: nowrap;
      }
      .sync-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-3);
        transition: background 0.3s;
      }
      .sync-dot.ok {
        background: #10b981;
      }
      .sync-dot.err {
        background: #ef4444;
      }
      .sync-dot.loading {
        background: var(--primary);
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: var(--r-sm);
        border: 1.5px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s;
      }
      .icon-btn:hover {
        background: var(--bg);
        color: var(--text);
      }

      /* ── FILTER BAR ──────────────────────────────── */
      .filter-bar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        height: 48px;
      }
      .filter-bar::-webkit-scrollbar {
        display: none;
      }
      .filter-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-3);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .filter-sep {
        width: 1px;
        height: 18px;
        background: var(--border);
        flex-shrink: 0;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 12px;
        border-radius: var(--r-pill);
        border: 1.5px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        font-size: 12px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: all 0.15s;
      }
      .chip:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .chip-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      /* ── TOOLBAR ─────────────────────────────────── */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px 10px;
        flex-wrap: wrap;
      }
      .sub-filter {
        display: flex;
        gap: 6px;
      }
      .sub-btn {
        padding: 5px 14px;
        border-radius: var(--r-pill);
        border: 1.5px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
      }
      .sub-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .sub-btn.active {
        background: var(--primary-light);
        border-color: var(--primary);
        color: var(--primary);
      }
      .count-badge {
        background: var(--primary-light);
        color: var(--primary);
        padding: 3px 11px;
        border-radius: var(--r-pill);
        font-size: 12px;
        font-weight: 700;
      }
      .sort-wrap {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sort-label {
        font-size: 12px;
        color: var(--text-3);
      }
      .sort-sel {
        border: 1.5px solid var(--border);
        border-radius: var(--r-sm);
        padding: 5px 9px;
        font-size: 12px;
        font-family: inherit;
        color: var(--text);
        background: var(--surface);
        cursor: pointer;
        outline: none;
      }
      .sort-sel:focus {
        border-color: var(--primary);
      }

      /* ── MAIN ────────────────────────────────────── */
      .main {
        padding: 0 24px 48px;
      }

      /* ── BOARD VIEW ──────────────────────────────── */
      .board-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--surface);
        border-radius: var(--r);
        border: 1.5px solid var(--border);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        cursor: pointer;
        position: relative;
        transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
        display: flex;
      }
      .card:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
        border-color: #cbd5e1;
      }
      .card-accent {
        width: 4px;
        flex-shrink: 0;
      }
      .card-body {
        flex: 1;
        padding: 16px 18px;
        min-width: 0;
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .card-name {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.3;
      }
      .card-item {
        font-size: 11px;
        color: var(--text-2);
        margin-top: 2px;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 9px;
        border-radius: var(--r-pill);
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .card-info {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-bottom: 10px;
      }
      .card-info-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--text-2);
      }

      .card-memo {
        font-size: 12px;
        color: var(--text-2);
        line-height: 1.6;
        background: var(--bg);
        border-radius: var(--r-sm);
        padding: 8px 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 34px;
      }
      .card-memo.empty {
        color: var(--text-3);
        font-style: italic;
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }
      .card-date {
        font-size: 11px;
        color: var(--text-3);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .card-person {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-2);
      }

      /* ── LIST VIEW ───────────────────────────────── */
      .list-wrap {
        overflow-x: auto;
        border-radius: var(--r);
        border: 1.5px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow-sm);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      thead th {
        padding: 11px 14px;
        text-align: left;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-2);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: var(--bg);
        border-bottom: 1.5px solid var(--border);
        white-space: nowrap;
        position: sticky;
        top: 0;
      }
      tbody tr {
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.12s;
      }
      tbody tr:last-child {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #f8fafc;
      }
      tbody td {
        padding: 11px 14px;
        vertical-align: middle;
      }
      .td-name {
        font-weight: 700;
        white-space: nowrap;
      }
      .td-item {
        font-size: 12px;
        color: var(--text-2);
      }
      .td-memo {
        max-width: 260px;
        font-size: 12px;
        color: var(--text-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .td-date {
        white-space: nowrap;
        font-size: 12px;
        color: var(--text-2);
      }
      .td-person {
        white-space: nowrap;
        font-weight: 600;
      }
      .td-price {
        white-space: nowrap;
        font-size: 12px;
        color: var(--text-2);
      }

      /* ── EMPTY / ERROR ───────────────────────────── */
      .state-box {
        grid-column: 1/-1;
        text-align: center;
        padding: 72px 24px;
      }
      .state-icon {
        font-size: 48px;
        margin-bottom: 14px;
        opacity: 0.45;
      }
      .state-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-2);
        margin-bottom: 8px;
      }
      .state-desc {
        font-size: 13px;
        color: var(--text-3);
        line-height: 1.7;
      }
      .state-steps {
        display: inline-block;
        text-align: left;
        margin-top: 16px;
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: var(--r);
        padding: 14px 18px;
        font-size: 12px;
        color: var(--text-2);
        line-height: 2;
      }
      .state-steps code {
        background: #e2e8f0;
        padding: 1px 6px;
        border-radius: 4px;
        font-family: monospace;
      }

      /* skeleton */
      .skel {
        background: linear-gradient(
          90deg,
          #f1f5f9 25%,
          #e2e8f0 50%,
          #f1f5f9 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: var(--r);
        height: 170px;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* ── DETAIL OVERLAY ──────────────────────────── */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 300;
        padding: 20px;
        background: rgba(15, 23, 42, 0.42);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s;
      }
      .overlay.open {
        opacity: 1;
        pointer-events: all;
      }
      .modal {
        background: var(--surface);
        border-radius: 18px;
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 580px;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        transform: translateY(20px) scale(0.97);
        transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
        overflow: hidden;
      }
      .overlay.open .modal {
        transform: none;
      }

      .modal-header {
        display: flex;
        align-items: stretch;
        gap: 0;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .modal-accent {
        width: 5px;
        flex-shrink: 0;
      }
      .modal-header-content {
        flex: 1;
        padding: 18px 20px;
      }
      .modal-name {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.3;
      }
      .modal-item {
        font-size: 12px;
        color: var(--text-2);
        margin-top: 3px;
      }
      .modal-close {
        align-self: flex-start;
        margin: 14px 16px;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        border: 1.5px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s;
      }
      .modal-close:hover {
        background: var(--bg);
        color: var(--text);
      }

      .modal-body {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 18px;
      }
      .detail-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .detail-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .detail-value {
        font-size: 13px;
        color: var(--text);
        font-weight: 500;
      }
      .detail-value a {
        color: var(--primary);
        text-decoration: none;
      }
      .detail-value a:hover {
        text-decoration: underline;
      }
      .memo-section {
        margin-top: 4px;
      }
      .memo-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .memo-content {
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: var(--r-sm);
        padding: 14px 16px;
        font-size: 13px;
        color: var(--text-2);
        line-height: 1.8;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 60px;
      }
      .memo-content.empty {
        color: var(--text-3);
        font-style: italic;
      }

      /* ── EDIT MODE ───────────────────────────────── */
      .modal-edit-btn {
        align-self: flex-start;
        margin: 14px 0 14px 0;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        border: 1.5px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s;
      }
      .modal-edit-btn:hover {
        background: var(--primary-light);
        color: var(--primary);
        border-color: var(--primary);
      }
      .modal-edit-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .edit-input,
      .edit-select {
        width: 100%;
        padding: 7px 10px;
        border: 1.5px solid var(--border);
        border-radius: var(--r-sm);
        font-family: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .edit-input:focus,
      .edit-select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14);
        background: #fff;
      }
      .edit-textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        padding: 10px 12px;
        border: 1.5px solid var(--border);
        border-radius: var(--r-sm);
        font-family: inherit;
        font-size: 13px;
        color: var(--text);
        line-height: 1.7;
        background: var(--bg);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .edit-textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14);
        background: #fff;
      }
      .modal-footer {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        padding: 14px 24px;
        border-top: 1px solid var(--border);
      }
      .btn {
        padding: 8px 20px;
        border-radius: var(--r-sm);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1.5px solid transparent;
        transition: all 0.15s;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .btn-primary:hover {
        background: var(--primary-dark);
      }
      .btn-primary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-2);
        border-color: var(--border);
      }
      .btn-ghost:hover {
        border-color: var(--text-2);
        color: var(--text);
      }

      /* ── TOAST ───────────────────────────────────── */
      .toast-wrap {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 900;
        pointer-events: none;
      }
      .toast {
        background: #1e293b;
        color: #fff;
        padding: 9px 18px;
        border-radius: var(--r-pill);
        font-size: 13px;
        font-weight: 500;
        box-shadow: var(--shadow-md);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.22s, transform 0.22s;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      .toast.warn {
        background: #dc2626;
      }
      .toast.ok {
        background: #059669;
      }

      /* ── RESPONSIVE ──────────────────────────────── */
      @media (max-width: 640px) {
        /* ── 헤더: 2단 레이아웃 ── */
        .header { padding: 0; }
        .header-top {
          flex-wrap: wrap;
          height: auto;
          padding: 10px 14px 0;
          gap: 8px;
        }
        .logo-icon { width: 28px; height: 28px; }
        .logo-text { display: none; }
        .search-wrap { flex: 1; max-width: none; }
        .search-input { height: 34px; font-size: 12px; }
        .hdr-right { gap: 6px; order: 3; }
        .sync-pill { padding: 4px 7px; }
        .sync-pill span { display: none; }

      /* 웹에 게시된 CSV URL (파일→웹에 게시 후 생성된 e/ ID 사용) */
      const CSV_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTEDBmEByiiDk9ayxyeaAtmjScg3h4Wc6TqOAjBKhYDZabIwKIwKEsD5EEbSH8Q1SK3WectpIr5z0VM/pub?output=csv&gid=0";
      const INTERVAL = 60; // 자동 새로고침 (초)

      /* ── 양방향 동기화 설정 ────────────────────────────────
   아래 순서로 Apps Script를 배포한 뒤 URL을 입력하세요.

   1. 스프레드시트 → 확장 프로그램 → Apps Script

   // ── 검색결과 링크 추출 ────────────────────────────────
   function extractLinks(url) {
     try {
       const html = UrlFetchApp.fetch(url, {
         headers: {
           'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
           'Accept-Language': 'ko-KR,ko;q=0.9',
         },
         muteHttpExceptions: true, followRedirects: true
       }).getContentText('UTF-8');
       // Next.js __NEXT_DATA__ JSON에서 itemId 추출
       const ndm = html.match(/<script id="__NEXT_DATA__" type="application\/json">([^<]+)<\/script>/);
       if (ndm) {
         const jsonStr = ndm[1];
         const seen = new Set();
         const links = [];
         const itemRe = /"itemId":"(\d+)"/g;
         let m;
         while ((m = itemRe.exec(jsonStr)) !== null) {
           const itemId = m[1];
           if (seen.has(itemId)) continue;
           seen.add(itemId);
           const chunk = jsonStr.substring(Math.max(0, m.index - 100), m.index + 200);
           const snm = chunk.match(/"siteNo":"(\d+)"/);
           const siteNo = snm ? snm[1] : '6001';
           links.push('https://emart.ssg.com/item/itemView.ssg?itemId=' + itemId + '&siteNo=' + siteNo);
         }
         if (links.length > 0) return res({success: true, links: links});
       }
       return res({success: false, error: '상품 링크를 찾지 못했습니다'});
     } catch(e) { return res({success: false, error: e.message}); }
   }

   // ── 쇼핑몰 상품 스크래핑 ──────────────────────────────
   function scrapeProduct(url) {
     try {
       const html = UrlFetchApp.fetch(url, {
         headers: {
           'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
           'Accept-Language': 'ko-KR,ko;q=0.9',
         },
         muteHttpExceptions: true,
         followRedirects: true
       }).getContentText('UTF-8');
       const data = {
         품명:         fld(html, ['품명 및 모델명','품명','상품명','제품명']),
         제조사수입자: fld(html, ['제조사/수입자','제조사 및 수입자','제조사','수입자','브랜드']),
         제조국:       fld(html, ['제조국','원산지','생산국','제조 국가']),
         전화번호:     phone(fld(html, ['A/S 책임자 및 전화번호','고객센터','A/S 연락처','전화번호','고객센터 전화번호'])),
       };
       return res({success:true, data:data});
     } catch(e) { return res({success:false, error:e.message}); }
   }
   function fld(html, keys) {
     for (const key of keys) {
       const k = key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\//g,'[/／]');
       for (const [op,cl] of [['th','td'],['dt','dd'],['strong','span'],['b','td']]) {
         const m = html.match(new RegExp('<'+op+'[^>]*>[\\s\\S]{0,150}'+k+'[\\s\\S]{0,150}</'+op+'>[\\s\\S]{0,400}?<'+cl+'[^>]*>([\\s\\S]{0,800}?)</'+cl+'>'));
         if (m) {
           const v = m[1].replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
           if (v && v.length < 300) return v;
         }
       }
     }
     return '';
   }
   function phone(text) {
     if (!text) return '';
     const m = text.match(/0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}/);
     return m ? m[0].replace(/[.\s]/g,'-') : text.slice(0,30);
   }
   function handle(e) {
     try {
       const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
       const headers = sheet.getRange(1,1,1,sheet.getLastColumn()).getValues()[0];
       const name  = e.parameter.name;
       const col   = e.parameter.col;
       const value = e.parameter.value;
       const nameIdx = headers.indexOf('업체명');
       const colIdx  = headers.indexOf(col);
       if (nameIdx < 0 || colIdx < 0) return res({success:false, error:'컬럼 없음'});
       const vals = sheet.getDataRange().getValues();
       for (let i = 1; i < vals.length; i++) {
         if (String(vals[i][nameIdx]).trim() === String(name).trim()) {
           sheet.getRange(i+1, colIdx+1).setValue(value);
           return res({success:true});
         }
       }
       return res({success:false, error:'업체를 찾을 수 없습니다'});
     } catch(err) { return res({success:false, error:err.message}); }
   }
   function res(d) {
     return ContentService.createTextOutput(JSON.stringify(d))
       .setMimeType(ContentService.MimeType.JSON);
   }
   // ── 시트 자동 포맷 (onEdit 트리거 — 재배포 불필요, 그냥 추가) ──
   function onEdit(e) {

     const phoneCol = headers.indexOf('연락처') + 1;
     if (e.range.getColumn() === phoneCol && e.range.getRow() > 1) {
       const fmt = formatPhoneGS(String(e.value || ''));
       if (fmt !== e.value) e.range.setValue(fmt);
     }
   }
   function formatPhoneGS(raw) {
     const d = raw.replace(/[^0-9]/g,'').slice(0,11);
     if (!d) return '';
     if (d.startsWith('02')) {
       if (d.length<=2) return d;
       if (d.length<=5) return d.slice(0,2)+'-'+d.slice(2);
       if (d.length<=9) return d.slice(0,2)+'-'+d.slice(2,d.length-4)+'-'+d.slice(-4);
       return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6);
     }
     if (d.length<=3) return d;
     if (d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
     if (d.length<=10) return d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);
     return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
   }

      ];
      const FALLBACK_COLORS = [
        "#8B5CF6",
        "#F59E0B",
        "#06B6D4",
        "#84CC16",
        "#EC4899",
      ];
      const _colorCache = {};
      function statusMeta(s) {
        if (!s) return { color: "#9CA3AF", bg: "#F9FAFB" };
        if (_colorCache[s]) return _colorCache[s];
        const lower = s.toLowerCase();
        for (const p of STATUS_PALETTE) {
          if (p.keys.some((k) => lower.includes(k.toLowerCase()))) {
            return (_colorCache[s] = p);
          }
        }
        const i =
          Math.abs([...s].reduce((a, c) => a + c.charCodeAt(0), 0)) %
          FALLBACK_COLORS.length;
        return (_colorCache[s] = { color: FALLBACK_COLORS[i], bg: "#F8F9FA" });
      }

      async function fetchData() {
        const url = CSV_URL + "&cachebust=" + Date.now();
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        return parseCSV(text);
      }

      function parseCSV(text) {
        /* RFC 4180 호환 CSV 파서 — 셀 내 줄바꿈·쉼표 처리 */
        const rows = [];
        let row = [],
          field = "",
          inQ = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i],
            nx = text[i + 1];
          if (inQ) {
            if (ch === '"' && nx === '"') {
              field += '"';
              i++;
            } else if (ch === '"') {
              inQ = false;
            } else {
              field += ch;
            }
          } else {
            if (ch === '"') {
              inQ = true;
            } else if (ch === ",") {
              row.push(field.trim());
              field = "";
            } else if (ch === "\n") {
              row.push(field.trim());
              if (row.some((v) => v)) rows.push(row);
              row = [];
              field = "";
            } else if (ch !== "\r") {
              field += ch;
            }
          }
        }
        if (field || row.length) {
          row.push(field.trim());
          if (row.some((v) => v)) rows.push(row);
        }

        if (rows.length < 2) return [];
        const headers = rows[0];
        return rows
          .slice(1)
          .map((r) => {
            const obj = {};
            headers.forEach((h, i) => {
              obj[h] = r[i] || "";
            });
            return obj;
          })
          .filter((r) => r[COL.name] && r[COL.name].trim() !== "");
      }

      async function sync() {
        setSyncState("loading", "불러오는 중...");
        try {
          const rows = await fetchData();
          clients = rows;

          /* 아이템 필터 동적 수집 */
          itemVals = [...new Set(rows.map((r) => r[COL.item]).filter(Boolean))];

          setSyncState(

            `${String(now.getHours()).padStart(2, "0")}:${String(

          );
        } catch (e) {
          setSyncState("err", "연결 오류");
          if (clients.length === 0) renderError(e.message);
          showToast("데이터를 가져오지 못했습니다.", "warn");
        }
      }

      function startTimer() {

      function buildFilters() {
        /* 상태 chips */
        const bar = document.getElementById("filterBar");
        bar.innerHTML = `<span class="filter-label">상태</span>`;
        ["전체", ...STATUS_OPTIONS].forEach((v) => {
          const m = statusMeta(v);
          const active = state.statusFilter === v ? "active" : "";
          const dot =
            v !== "전체"
              ? `<span class="chip-dot" style="background:${m.color}"></span>`
              : "";
          const el = document.createElement("button");
          el.className = `chip ${active}`;
          el.dataset.filter = "status";
          el.dataset.val = v;
          el.innerHTML = dot + v;
          bar.appendChild(el);
        });

        /* 아이템 sub-filter */
        const iWrap = document.getElementById("itemFilter");
        iWrap.innerHTML = `<span class="filter-label" style="line-height:2">아이템</span>`;
        ["전체", ...itemVals].forEach((v) => {
          const active = state.itemFilter === v ? "active" : "";
          const el = document.createElement("button");
          el.className = `sub-btn ${active}`;
          el.dataset.filter = "item";
          el.dataset.val = v;
          el.textContent = v;
          iWrap.appendChild(el);
        });
      }

      /* ══════════════════════════════════════════════════════
   FILTER + SORT
   ══════════════════════════════════════════════════════ */
      function getFiltered() {
        let list = [...clients];
        const q = state.search.trim().toLowerCase();
        if (q)
          list = list.filter(
            (r) =>
              (r[COL.name] || "").toLowerCase().includes(q) ||
              (r[COL.person] || "").toLowerCase().includes(q) ||
              (r[COL.memo] || "").toLowerCase().includes(q) ||
              (r[COL.item] || "").toLowerCase().includes(q)
          );
        if (state.statusFilter !== "전체")
          list = list.filter((r) => r[COL.status] === state.statusFilter);
        if (state.itemFilter !== "전체")
          list = list.filter((r) => r[COL.item] === state.itemFilter);
        list.sort((a, b) => {
          if (state.sort === "date")
            return (b[COL.date] || "").localeCompare(a[COL.date] || "");
          return (a[COL.name] || "").localeCompare(b[COL.name] || "", "ko");
        });
        return list;
      }

      /* ══════════════════════════════════════════════════════

      async function saveEdits() {
        const inputs = document
          .getElementById("modalBody")
          .querySelectorAll("[data-col]");
        const changes = [];
        inputs.forEach((el) => {
          const col = el.dataset.col;
          const newVal = el.value.trim();
          if (newVal !== (_currentRow[col] || "").trim())
            changes.push({ col, value: newVal });
        });

        if (changes.length === 0) {
          exitEditMode();
          return;
        }

        const saveBtn = document.getElementById("saveBtn");
        const saveStatus = document.getElementById("saveStatus");
        saveBtn.textContent = "저장 중...";
        saveBtn.disabled = true;
        saveStatus.textContent = "";

        try {
          await Promise.all(
            changes.map((c) =>
              updateCell(_currentRow[COL.name], c.col, c.value)
            )
          );

          /* 로컬 데이터 즉시 반영 */
          changes.forEach((c) => {
            _currentRow[c.col] = c.value;
          });
          const idx = clients.findIndex(
            (r) => r[COL.name] === _currentRow[COL.name]
          );
          if (idx !== -1) clients[idx] = { ...clients[idx], ..._currentRow };

          /* 상태·아이템이 바뀌면 필터 재빌드 */
          if (changes.some((c) => c.col === COL.status || c.col === COL.item)) {
            itemVals = [
              ...new Set(clients.map((r) => r[COL.item]).filter(Boolean)),
            ];
            buildFilters();
          }
          render();
          exitEditMode();
          showToast("저장되었습니다", "ok");
        } catch (e) {
          saveStatus.textContent = e.message || "저장 실패";
          saveBtn.textContent = "저장";
          saveBtn.disabled = false;
        }
      }

      async function updateCell(name, col, value) {
        const url = new URL(APPS_SCRIPT_URL);
        url.searchParams.set("name", name);
        url.searchParams.set("col", col);
        url.searchParams.set("value", value);
        const res = await fetch(url.toString());
        if (!res.ok) throw new Error(`서버 오류 (HTTP ${res.status})`);
        let json;
        try {
          json = await res.json();
        } catch {
          throw new Error("응답 파싱 실패");
        }
        if (!json.success) throw new Error(json.error || "저장 실패");
      }

        중국: { bg: "#FFF7ED", color: "#EA580C" },
        한국: { bg: "#EFF6FF", color: "#2563EB" },
        미국: { bg: "#F0FDF4", color: "#15803D" },

      function saveScan() {

      async function runScan() {
        const ta = document.getElementById("scanUrlInput");
        const urls = ta.value
          .split("\n")
          .map((u) => u.trim())
          .filter((u) => /^https?:\/\//.test(u));
        if (!urls.length) {
          showToast("URL을 입력해주세요", "warn");
          return;
        }
        if (!APPS_SCRIPT_URL) {
          showToast("APPS_SCRIPT_URL을 먼저 설정해주세요", "warn");
          return;
        }

        const btn = document.getElementById("scanBtn");
        const prog = document.getElementById("scanProgress");
        btn.disabled = true;
        let ok = 0,
          fail = 0;

        for (let i = 0; i < urls.length; i++) {
          const url = urls[i];
          prog.textContent = `분석 중 ${i + 1}/${urls.length}…`;
          try {
            const api = new URL(APPS_SCRIPT_URL);
            api.searchParams.set("action", "scrape");
            api.searchParams.set("url", url);
            const res = await fetch(api.toString());
            const json = await res.json();
            if (json.success && json.data) {
              if (!scannedItems.some((x) => x.url === url)) {
                const item = { ...json.data, url, addedAt: new Date().toISOString() };
                scannedItems.push(item);
                saveItemToSheet(item);
              }
              ok++;
            } else {
              fail++;
              showToast(`분석 실패: ${json.error || ""}`, "warn");
            }
          } catch (e) {
            fail++;
            showToast(`오류: ${e.message}`, "warn");
          }
        }

        saveScan();
        ta.value = "";
        prog.textContent = `완료 — 성공 ${ok}개${
          fail ? `, 실패 ${fail}개` : ""
        }`;
        btn.disabled = false;
        renderScanResults();
      }

      async function saveItemToSheet(item) {
        if (!APPS_SCRIPT_URL) return;
        try {
          const api = new URL(APPS_SCRIPT_URL);
          api.searchParams.set('action', 'saveToEmart');
          api.searchParams.set('url', item.url || '');
          api.searchParams.set('품명', item.품명 || '');
          api.searchParams.set('제조사수입자', item.제조사수입자 || '');
          api.searchParams.set('제조국', item.제조국 || '');
          api.searchParams.set('전화번호', item.전화번호 || '');
          api.searchParams.set('addedAt', item.addedAt || '');
          await fetch(api.toString());
        } catch(e) { /* silent */ }
      }

      /* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
      function formatPhone(raw) {
        const d = raw.replace(/\D/g, "").slice(0, 11);
        if (!d) return "";
        if (d.startsWith("02")) {
          if (d.length <= 2) return d;
          if (d.length <= 5) return d.slice(0, 2) + "-" + d.slice(2);
          if (d.length <= 9)
            return (
              d.slice(0, 2) + "-" + d.slice(2, d.length - 4) + "-" + d.slice(-4)
            );
          return d.slice(0, 2) + "-" + d.slice(2, 6) + "-" + d.slice(6);
        }
        if (d.length <= 3) return d;
        if (d.length <= 7) return d.slice(0, 3) + "-" + d.slice(3);
        if (d.length <= 10)
          return (
            d.slice(0, 3) + "-" + d.slice(3, d.length - 4) + "-" + d.slice(-4)
          );
        return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function showToast(msg, type = "") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "toast" + (type ? " " + type : "");
        requestAnimationFrame(() => el.classList.add("show"));
        clearTimeout(_toastT);
        _toastT = setTimeout(() => el.classList.remove("show"), 3000);
      }

      async function runExtract() {
        const url = document.getElementById('extractUrlInput').value.trim();
        if (!url) return;
        const statusEl = document.getElementById('extractStatus');
        const resultEl = document.getElementById('extractResult');
        const copyBtn  = document.getElementById('extractCopyBtn');
        const toScanBtn = document.getElementById('extractToScanBtn');
        statusEl.textContent = '추출 중…';
        resultEl.style.display = 'none';
        copyBtn.style.display = 'none';
        toScanBtn.style.display = 'none';

        try {
          const api = new URL(APPS_SCRIPT_URL);
          api.searchParams.set('action', 'extractLinks');
          api.searchParams.set('url', url);
          const res = await fetch(api.toString());
          const json = await res.json();
          if (!json.success) throw new Error(json.error || '추출 실패');
          const links = json.links;
          if (!links.length) { statusEl.textContent = '링크를 찾지 못했습니다'; return; }
          statusEl.textContent = `${links.length}개 링크 추출됨`;
          resultEl.textContent = links.join('\n');
          resultEl.style.display = 'block';
          copyBtn.style.display = '';
          toScanBtn.style.display = '';

          copyBtn.onclick = () => {
            navigator.clipboard.writeText(links.join('\n'));
            copyBtn.textContent = '복사됨 ✓';
            setTimeout(() => { copyBtn.textContent = '전체 복사'; }, 1500);
          };
          toScanBtn.onclick = () => {
            const ta = document.getElementById('scanUrlInput');
            const existing = ta.value.trim();
            ta.value = (existing ? existing + '\n' : '') + links.join('\n');
            document.getElementById('extractSection').removeAttribute('open');
            showToast(`${links.length}개 링크를 스캔 입력창에 추가했습니다`);
          };
        } catch(e) {
          statusEl.textContent = '오류: ' + e.message;
        }
      }

      document.getElementById("saveBtn").addEventListener("click", saveEdits);
      document
        .getElementById("cancelBtn")
        .addEventListener("click", exitEditMode);
      document.getElementById("overlay").addEventListener("click", (e) => {
        if (e.target === document.getElementById("overlay")) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (_editMode) exitEditMode();
          else closeModal();
        }
      });

      /* ══════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════ */
      sync().then(() => startTimer());

      /* ── LOCK SCREEN ─────────────────────────────────── */
      (() => {
        const CORRECT = '7089';
        const lock = document.getElementById('lockScreen');
        if (sessionStorage.getItem('unlocked') === '1') { lock.style.display = 'none'; return; }

        let pin = '';
        const dots = [0,1,2,3].map(i => document.getElementById('d'+i));
        const errEl = document.getElementById('lockError');

        function updateDots() {
          dots.forEach((d, i) => {
            d.classList.toggle('filled', i < pin.length);
            d.classList.remove('error');
          });
          errEl.textContent = '';
        }

        function shake() {
          dots.forEach(d => d.classList.add('error'));
          errEl.textContent = '비밀번호가 틀렸습니다';
          setTimeout(() => { pin = ''; updateDots(); }, 800);
        }

        document.querySelectorAll('.pin-key').forEach(btn => {
          btn.addEventListener('click', () => {
            const k = btn.dataset.k;
            if (k === 'del') { pin = pin.slice(0,-1); updateDots(); return; }
            if (k === '' || pin.length >= 4) return;
            pin += k;
            updateDots();
            if (pin.length === 4) {
              if (pin === CORRECT) {
                sessionStorage.setItem('unlocked', '1');
                lock.style.display = 'none';
              } else {
                shake();
              }
            }
          });
        });

        document.addEventListener('keydown', e => {
          if (lock.style.display === 'none') return;
          if (e.key >= '0' && e.key <= '9' && pin.length < 4) {
            pin += e.key; updateDots();
            if (pin.length === 4) {
              if (pin === CORRECT) { sessionStorage.setItem('unlocked','1'); lock.style.display='none'; }
              else shake();
            }
          } else if (e.key === 'Backspace') { pin = pin.slice(0,-1); updateDots(); }
        });
      })();
    </script>
  </body>
</html>
