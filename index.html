<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영업 파이프라인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --primary-light: #EFF6FF;
      --bg: #F1F5F9;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #1E293B;
      --text-2: #64748B;
      --text-3: #94A3B8;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 16px rgba(0,0,0,.09), 0 2px 6px rgba(0,0,0,.05);
      --shadow-lg: 0 10px 40px rgba(0,0,0,.13), 0 4px 12px rgba(0,0,0,.07);
      --r: 12px; --r-sm: 8px; --r-pill: 999px;
    }
    html { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── HEADER ─────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface); border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm); padding: 0 24px;
    }
    .header-top { display: flex; align-items: center; gap: 12px; height: 60px; }
    .logo { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
    .logo-icon {
      width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, #3B82F6, #2563EB);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; font-weight: 700;
    }
    .logo-text { font-size: 16px; font-weight: 700; white-space: nowrap; }

    .search-wrap { flex: 1; max-width: 420px; position: relative; }
    .search-ico {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--text-3); pointer-events: none;
    }
    .search-input {
      width: 100%; height: 38px; padding: 0 12px 0 34px;
      border: 1.5px solid var(--border); border-radius: var(--r-pill);
      font-family: inherit; font-size: 13px; color: var(--text);
      background: var(--bg); outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.14); background:#fff; }

    .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    /* view toggle */
    .view-toggle { display: flex; background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-sm); padding: 2px; gap: 2px; }
    .view-btn {
      padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer;
      font-family: inherit; font-size: 12px; font-weight: 600; color: var(--text-2);
      background: transparent; display: flex; align-items: center; gap: 5px;
      transition: all .15s;
    }
    .view-btn.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }

    .sync-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 11px; border-radius: var(--r-pill);
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 11px; color: var(--text-3); white-space: nowrap;
    }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); transition: background .3s; }
    .sync-dot.ok  { background: #10B981; }
    .sync-dot.err { background: #EF4444; }
    .sync-dot.loading { background: var(--primary); animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    .icon-btn {
      width: 34px; height: 34px; border-radius: var(--r-sm);
      border: 1.5px solid var(--border); background: var(--surface);
      color: var(--text-2); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s;
    }
    .icon-btn:hover { background: var(--bg); color: var(--text); }

    /* ── FILTER BAR ──────────────────────────────── */
    .filter-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 24px; display: flex; align-items: center; gap: 8px;
      overflow-x: auto; scrollbar-width: none; height: 48px;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-label { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    .filter-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px;
      border-radius: var(--r-pill); border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text-2);
      font-size: 12px; font-weight: 500; font-family: inherit;
      cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all .15s;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .chip-dot { width: 6px; height: 6px; border-radius: 50%; }

    /* ── TOOLBAR ─────────────────────────────────── */
    .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 24px 10px; flex-wrap: wrap; }
    .sub-filter { display: flex; gap: 6px; }
    .sub-btn {
      padding: 5px 14px; border-radius: var(--r-pill);
      border: 1.5px solid var(--border); background: var(--surface); color: var(--text-2);
      font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .15s;
    }
    .sub-btn:hover { border-color: var(--primary); color: var(--primary); }
    .sub-btn.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .count-badge { background: var(--primary-light); color: var(--primary); padding: 3px 11px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700; }
    .sort-wrap { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .sort-label { font-size: 12px; color: var(--text-3); }
    .sort-sel {
      border: 1.5px solid var(--border); border-radius: var(--r-sm);
      padding: 5px 9px; font-size: 12px; font-family: inherit;
      color: var(--text); background: var(--surface); cursor: pointer; outline: none;
    }
    .sort-sel:focus { border-color: var(--primary); }

    /* ── MAIN ────────────────────────────────────── */
    .main { padding: 0 24px 48px; }

    /* ── BOARD VIEW ──────────────────────────────── */
    .board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .card {
      background: var(--surface); border-radius: var(--r);
      border: 1.5px solid var(--border); box-shadow: var(--shadow-sm);
      overflow: hidden; cursor: pointer; position: relative;
      transition: box-shadow .2s, transform .2s, border-color .2s;
      display: flex;
    }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: #CBD5E1; }
    .card-accent { width: 4px; flex-shrink: 0; }
    .card-body { flex: 1; padding: 16px 18px; min-width: 0; }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .card-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .card-item { font-size: 11px; color: var(--text-2); margin-top: 2px; }
    .status-badge {
      display: inline-flex; align-items: center; padding: 3px 9px;
      border-radius: var(--r-pill); font-size: 11px; font-weight: 700;
      white-space: nowrap; flex-shrink: 0;
    }

    .card-info { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 10px; }
    .card-info-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-2); }

    .card-memo {
      font-size: 12px; color: var(--text-2); line-height: 1.6;
      background: var(--bg); border-radius: var(--r-sm); padding: 8px 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      min-height: 34px;
    }
    .card-memo.empty { color: var(--text-3); font-style: italic; }

    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .card-date { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
    .card-person { font-size: 11px; font-weight: 600; color: var(--text-2); }

    /* ── LIST VIEW ───────────────────────────────── */
    .list-wrap { overflow-x: auto; border-radius: var(--r); border: 1.5px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      padding: 11px 14px; text-align: left; font-size: 11px; font-weight: 700;
      color: var(--text-2); letter-spacing: .05em; text-transform: uppercase;
      background: var(--bg); border-bottom: 1.5px solid var(--border);
      white-space: nowrap; position: sticky; top: 0;
    }
    tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #F8FAFC; }
    tbody td { padding: 11px 14px; vertical-align: middle; }
    .td-name { font-weight: 700; white-space: nowrap; }
    .td-item { font-size: 12px; color: var(--text-2); }
    .td-memo { max-width: 260px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .td-date { white-space: nowrap; font-size: 12px; color: var(--text-2); }
    .td-person { white-space: nowrap; font-weight: 600; }
    .td-price { white-space: nowrap; font-size: 12px; color: var(--text-2); }

    /* ── EMPTY / ERROR ───────────────────────────── */
    .state-box { grid-column: 1/-1; text-align: center; padding: 72px 24px; }
    .state-icon { font-size: 48px; margin-bottom: 14px; opacity: .45; }
    .state-title { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
    .state-desc { font-size: 13px; color: var(--text-3); line-height: 1.7; }
    .state-steps {
      display: inline-block; text-align: left; margin-top: 16px;
      background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r);
      padding: 14px 18px; font-size: 12px; color: var(--text-2); line-height: 2;
    }
    .state-steps code { background: #E2E8F0; padding: 1px 6px; border-radius: 4px; font-family: monospace; }

    /* skeleton */
    .skel { background: linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius: var(--r); height: 170px; }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* ── DETAIL OVERLAY ──────────────────────────── */
    .overlay {
      position: fixed; inset: 0; z-index: 300; padding: 20px;
      background: rgba(15,23,42,.42); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .22s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
      width: 100%; max-width: 580px; max-height: 88vh;
      display: flex; flex-direction: column;
      transform: translateY(20px) scale(.97);
      transition: transform .24s cubic-bezier(.34,1.56,.64,1);
      overflow: hidden;
    }
    .overlay.open .modal { transform: none; }

    .modal-header {
      display: flex; align-items: stretch; gap: 0;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .modal-accent { width: 5px; flex-shrink: 0; }
    .modal-header-content { flex: 1; padding: 18px 20px; }
    .modal-name { font-size: 19px; font-weight: 700; line-height: 1.3; }
    .modal-item { font-size: 12px; color: var(--text-2); margin-top: 3px; }
    .modal-close {
      align-self: flex-start; margin: 14px 16px; width: 32px; height: 32px;
      border-radius: 9px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s;
    }
    .modal-close:hover { background: var(--bg); color: var(--text); }

    .modal-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .detail-item { display: flex; flex-direction: column; gap: 4px; }
    .detail-label { font-size: 10px; font-weight: 700; color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; }
    .detail-value { font-size: 13px; color: var(--text); font-weight: 500; }
    .detail-value a { color: var(--primary); text-decoration: none; }
    .detail-value a:hover { text-decoration: underline; }
    .memo-section { margin-top: 4px; }
    .memo-label { font-size: 10px; font-weight: 700; color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    .memo-content {
      background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-sm);
      padding: 14px 16px; font-size: 13px; color: var(--text-2);
      line-height: 1.8; white-space: pre-wrap; word-break: break-word; min-height: 60px;
    }
    .memo-content.empty { color: var(--text-3); font-style: italic; }

    /* ── TOAST ───────────────────────────────────── */
    .toast-wrap { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 900; pointer-events: none; }
    .toast {
      background: #1E293B; color: #fff; padding: 9px 18px;
      border-radius: var(--r-pill); font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow-md); opacity: 0; transform: translateY(8px);
      transition: opacity .22s, transform .22s; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.warn { background: #DC2626; }
    .toast.ok   { background: #059669; }

    /* ── RESPONSIVE ──────────────────────────────── */
    @media(max-width:640px){
      .header { padding: 0 14px; }
      .logo-text, .sync-pill span { display: none; }
      .filter-bar { padding: 0 14px; }
      .toolbar { padding: 12px 14px 8px; }
      .main { padding: 0 14px 48px; }
      .board-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .modal { max-width: 100%; border-radius: 18px 18px 0 0; align-self: flex-end; }
      .overlay { align-items: flex-end; padding: 0; }
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }
  </style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────── -->
<header class="header">
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">영</div>
      <span class="logo-text">영업 파이프라인</span>
    </div>
    <div class="search-wrap">
      <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" class="search-input" type="text" placeholder="업체명, 담당자, 메모 검색..." autocomplete="off" />
    </div>
    <div class="hdr-right">
      <div class="view-toggle">
        <button class="view-btn active" id="btnBoard">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          보드
        </button>
        <button class="view-btn" id="btnList">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          목록
        </button>
      </div>
      <div class="sync-pill">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncText">미연결</span>
      </div>
      <button class="icon-btn" id="refreshBtn" title="새로고침">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ── FILTER BAR (상태) ────────────────────────────── -->
<div class="filter-bar" id="filterBar">
  <span class="filter-label">상태</span>
  <button class="chip active" data-filter="status" data-val="전체">전체</button>
</div>

<!-- ── TOOLBAR ─────────────────────────────────────── -->
<div class="toolbar">
  <div class="sub-filter" id="itemFilter">
    <span class="filter-label" style="line-height:2">아이템</span>
    <button class="sub-btn active" data-filter="item" data-val="전체">전체</button>
  </div>
  <span class="count-badge" id="countBadge">0건</span>
  <div class="sort-wrap">
    <span class="sort-label">정렬:</span>
    <select id="sortSel" class="sort-sel">
      <option value="date">최근연락일</option>
      <option value="name">업체명</option>
    </select>
  </div>
</div>

<!-- ── MAIN ────────────────────────────────────────── -->
<main class="main" id="main">
  <div class="board-grid" id="boardGrid">
    <div class="state-box">
      <div class="state-icon">📊</div>
      <div class="state-title">스프레드시트 연결 중...</div>
      <div class="state-desc">잠시 기다려 주세요.</div>
    </div>
  </div>
  <div class="list-wrap" id="listWrap" style="display:none">
    <table><thead><tr>
      <th>업체명</th><th>아이템</th><th>상태</th><th>담당자</th><th>견적구간</th><th>최근연락일</th><th>연락처</th><th>비고</th>
    </tr></thead><tbody id="listBody"></tbody></table>
  </div>
</main>

<!-- ── DETAIL MODAL ─────────────────────────────────── -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-accent" id="modalAccent"></div>
      <div class="modal-header-content">
        <div class="modal-name" id="modalName"></div>
        <div class="modal-item" id="modalItem"></div>
      </div>
      <button class="modal-close" id="modalClose">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────── -->
<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<script>
/* ══════════════════════════════════════════════════════
   CONFIG — 시트 ID 고정
   ══════════════════════════════════════════════════════ */
/* 웹에 게시된 CSV URL (파일→웹에 게시 후 생성된 e/ ID 사용) */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTEDBmEByiiDk9ayxyeaAtmjScg3h4Wc6TqOAjBKhYDZabIwKIwKEsD5EEbSH8Q1SK3WectpIr5z0VM/pub?output=csv&gid=0';
const INTERVAL = 60; // 자동 새로고침 (초)

/* 컬럼 헤더 → 내부 키 매핑 */
const COL = {
  name:    '업체명',
  phone:   '연락처',
  address: '주소',
  memo:    '비고',
  person:  '담당자',
  email:   '이메일',
  price:   '견적구간',
  status:  '상태',
  item:    '아이템',
  date:    '최근연락일',
};

/* 상태 → 색상 (동적으로도 대응) */
const STATUS_PALETTE = [
  { keys: ['영업불가','영업 불가','불가'],       color:'#EF4444', bg:'#FEF2F2' },
  { keys: ['진행중','진행','컨택중','컨택'],       color:'#F97316', bg:'#FFF7ED' },
  { keys: ['제안중','제안','미팅'],               color:'#8B5CF6', bg:'#F5F3FF' },
  { keys: ['성사','계약','완료'],                 color:'#10B981', bg:'#ECFDF5' },
  { keys: ['보류','대기','홀드'],                 color:'#6B7280', bg:'#F9FAFB' },
  { keys: ['신규','첫컨택'],                      color:'#3B82F6', bg:'#EFF6FF' },
];
const FALLBACK_COLORS = ['#8B5CF6','#F59E0B','#06B6D4','#84CC16','#EC4899'];
const _colorCache = {};
function statusMeta(s) {
  if (!s) return { color:'#9CA3AF', bg:'#F9FAFB' };
  if (_colorCache[s]) return _colorCache[s];
  const lower = s.toLowerCase();
  for (const p of STATUS_PALETTE) {
    if (p.keys.some(k => lower.includes(k.toLowerCase()))) {
      return (_colorCache[s] = p);
    }
  }
  const i = Math.abs([...s].reduce((a,c)=>a+c.charCodeAt(0),0)) % FALLBACK_COLORS.length;
  return (_colorCache[s] = { color: FALLBACK_COLORS[i], bg: '#F8F9FA' });
}

/* ══════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════ */
let clients   = [];
let statusVals = [];
let itemVals   = [];
let state = {
  view:        'board',   // 'board' | 'list'
  search:      '',
  statusFilter:'전체',
  itemFilter:  '전체',
  sort:        'date',
};
let refreshTimer = null;

/* ══════════════════════════════════════════════════════
   FETCH — 웹에 게시된 CSV 직접 파싱
   ══════════════════════════════════════════════════════ */
async function fetchData() {
  const url = CSV_URL + '&cachebust=' + Date.now();
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  return parseCSV(text);
}

function parseCSV(text) {
  /* RFC 4180 호환 CSV 파서 — 셀 내 줄바꿈·쉼표 처리 */
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], nx = text[i + 1];
    if (inQ) {
      if (ch === '"' && nx === '"') { field += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { field += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { row.push(field.trim()); field = ''; }
      else if (ch === '\n') { row.push(field.trim()); if (row.some(v => v)) rows.push(row); row = []; field = ''; }
      else if (ch !== '\r') { field += ch; }
    }
  }
  if (field || row.length) { row.push(field.trim()); if (row.some(v => v)) rows.push(row); }

  if (rows.length < 2) return [];
  const headers = rows[0];
  return rows.slice(1)
    .map(r => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = r[i] || ''; });
      return obj;
    })
    .filter(r => r[COL.name] && r[COL.name].trim() !== '');
}

async function sync() {
  setSyncState('loading', '불러오는 중...');
  try {
    const rows = await fetchData();
    clients = rows;

    /* 필터 옵션 동적 수집 */
    statusVals = [...new Set(rows.map(r => r[COL.status]).filter(Boolean))];
    itemVals   = [...new Set(rows.map(r => r[COL.item]).filter(Boolean))];

    buildFilters();
    render();

    const now = new Date();
    setSyncState('ok', `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 동기화`);
  } catch(e) {
    setSyncState('err', '연결 오류');
    if (clients.length === 0) renderError(e.message);
    showToast('데이터를 가져오지 못했습니다.', 'warn');
  }
}

function startTimer() {
  clearInterval(refreshTimer);
  if (INTERVAL > 0) refreshTimer = setInterval(sync, INTERVAL * 1000);
}

function setSyncState(st, txt) {
  document.getElementById('syncDot').className = 'sync-dot' + (st ? ' ' + st : '');
  document.getElementById('syncText').textContent = txt;
}

/* ══════════════════════════════════════════════════════
   BUILD DYNAMIC FILTERS
   ══════════════════════════════════════════════════════ */
function buildFilters() {
  /* 상태 chips */
  const bar = document.getElementById('filterBar');
  bar.innerHTML = `<span class="filter-label">상태</span>`;
  ['전체', ...statusVals].forEach(v => {
    const m = statusMeta(v);
    const active = state.statusFilter === v ? 'active' : '';
    const dot = v !== '전체' ? `<span class="chip-dot" style="background:${m.color}"></span>` : '';
    const el = document.createElement('button');
    el.className = `chip ${active}`;
    el.dataset.filter = 'status'; el.dataset.val = v;
    el.innerHTML = dot + v;
    bar.appendChild(el);
  });

  /* 아이템 sub-filter */
  const iWrap = document.getElementById('itemFilter');
  iWrap.innerHTML = `<span class="filter-label" style="line-height:2">아이템</span>`;
  ['전체', ...itemVals].forEach(v => {
    const active = state.itemFilter === v ? 'active' : '';
    const el = document.createElement('button');
    el.className = `sub-btn ${active}`;
    el.dataset.filter = 'item'; el.dataset.val = v;
    el.textContent = v;
    iWrap.appendChild(el);
  });
}

/* ══════════════════════════════════════════════════════
   FILTER + SORT
   ══════════════════════════════════════════════════════ */
function getFiltered() {
  let list = [...clients];
  const q = state.search.trim().toLowerCase();
  if (q) list = list.filter(r =>
    (r[COL.name]   ||'').toLowerCase().includes(q) ||
    (r[COL.person] ||'').toLowerCase().includes(q) ||
    (r[COL.memo]   ||'').toLowerCase().includes(q) ||
    (r[COL.item]   ||'').toLowerCase().includes(q)
  );
  if (state.statusFilter !== '전체') list = list.filter(r => r[COL.status] === state.statusFilter);
  if (state.itemFilter   !== '전체') list = list.filter(r => r[COL.item]   === state.itemFilter);
  list.sort((a, b) => {
    if (state.sort === 'date') return (b[COL.date]||'').localeCompare(a[COL.date]||'');
    return (a[COL.name]||'').localeCompare(b[COL.name]||'', 'ko');
  });
  return list;
}

/* ══════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════ */
function render() {
  const list = getFiltered();
  document.getElementById('countBadge').textContent = `${list.length}건`;
  if (state.view === 'board') renderBoard(list);
  else renderList(list);
}

/* BOARD */
function renderBoard(list) {
  document.getElementById('boardGrid').style.display = '';
  document.getElementById('listWrap').style.display  = 'none';
  const grid = document.getElementById('boardGrid');

  if (list.length === 0) { grid.innerHTML = emptyHTML(); return; }

  grid.innerHTML = list.map((r, idx) => {
    const m    = statusMeta(r[COL.status]);
    const memo = r[COL.memo] || '';
    return `
    <div class="card" data-idx="${idx}">
      <div class="card-accent" style="background:${m.color}"></div>
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="card-name">${esc(r[COL.name])}</div>
            <div class="card-item">${esc(r[COL.item])}</div>
          </div>
          <span class="status-badge" style="color:${m.color};background:${m.bg}">${esc(r[COL.status]||'—')}</span>
        </div>
        <div class="card-info">
          ${r[COL.phone]   ? `<span class="card-info-item"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.65 3.44 2 2 0 0 1 3.62 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6.13 6.13l.56-.56a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>${esc(r[COL.phone])}</span>` : ''}
          ${r[COL.address] ? `<span class="card-info-item"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(r[COL.address])}</span>` : ''}
          ${r[COL.price]   ? `<span class="card-info-item"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>${esc(r[COL.price])}</span>` : ''}
        </div>
        <div class="card-memo ${memo ? '' : 'empty'}">${esc(memo || '비고 없음')}</div>
        <div class="card-footer">
          <span class="card-date">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            ${esc(r[COL.date] || '—')}
          </span>
          <span class="card-person">${esc(r[COL.person] || '')}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openModal(list[+el.dataset.idx]));
  });
}

/* LIST */
function renderList(list) {
  document.getElementById('boardGrid').style.display = 'none';
  document.getElementById('listWrap').style.display  = '';
  const tbody = document.getElementById('listBody');

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:60px;color:var(--text-3)">결과 없음</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map((r, idx) => {
    const m = statusMeta(r[COL.status]);
    return `
    <tr data-idx="${idx}">
      <td>
        <div class="td-name" style="display:flex;align-items:center;gap:7px">
          <span style="width:3px;height:30px;border-radius:3px;background:${m.color};flex-shrink:0;display:inline-block"></span>
          ${esc(r[COL.name])}
        </div>
      </td>
      <td class="td-item">${esc(r[COL.item]||'—')}</td>
      <td><span class="status-badge" style="color:${m.color};background:${m.bg}">${esc(r[COL.status]||'—')}</span></td>
      <td class="td-person">${esc(r[COL.person]||'—')}</td>
      <td class="td-price">${esc(r[COL.price]||'—')}</td>
      <td class="td-date">${esc(r[COL.date]||'—')}</td>
      <td class="td-date">${esc(r[COL.phone]||'—')}</td>
      <td class="td-memo">${esc(r[COL.memo]||'')}</td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('tr').forEach(el => {
    el.addEventListener('click', () => openModal(list[+el.dataset.idx]));
  });
}

/* ── EMPTY / ERROR ── */
function emptyHTML() {
  return `<div class="state-box">
    <div class="state-icon">🔍</div>
    <div class="state-title">검색 결과가 없습니다</div>
    <div class="state-desc">다른 검색어나 필터를 사용해보세요</div>
  </div>`;
}

function renderError(msg) {
  const g = document.getElementById('boardGrid');
  const needs403 = msg.includes('403') || msg.includes('404');
  g.innerHTML = `<div class="state-box">
    <div class="state-icon">📋</div>
    <div class="state-title">${needs403 ? '스프레드시트 공개 설정이 필요합니다' : '데이터를 불러올 수 없습니다'}</div>
    <div class="state-desc">${needs403 ? '아래 순서대로 설정해주세요' : msg}</div>
    ${needs403 ? `<div class="state-steps">
      스프레드시트 → <code>파일</code> → <code>웹에 게시</code> → <code>게시</code> 클릭 후<br>
      이 페이지 새로고침 버튼을 눌러주세요.
    </div>` : ''}
  </div>`;
}

/* ══════════════════════════════════════════════════════
   DETAIL MODAL
   ══════════════════════════════════════════════════════ */
function openModal(r) {
  const m = statusMeta(r[COL.status]);
  document.getElementById('modalAccent').style.background = m.color;
  document.getElementById('modalName').textContent  = r[COL.name] || '';
  document.getElementById('modalItem').textContent  = r[COL.item] || '';

  document.getElementById('modalBody').innerHTML = `
    <div class="detail-grid">
      <div class="detail-item">
        <div class="detail-label">상태</div>
        <div class="detail-value"><span class="status-badge" style="color:${m.color};background:${m.bg}">${esc(r[COL.status]||'—')}</span></div>
      </div>
      <div class="detail-item">
        <div class="detail-label">담당자</div>
        <div class="detail-value">${esc(r[COL.person]||'—')}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">연락처</div>
        <div class="detail-value">${r[COL.phone] ? `<a href="tel:${esc(r[COL.phone])}">${esc(r[COL.phone])}</a>` : '—'}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">이메일</div>
        <div class="detail-value">${r[COL.email] ? `<a href="mailto:${esc(r[COL.email])}">${esc(r[COL.email])}</a>` : '—'}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">견적구간</div>
        <div class="detail-value">${esc(r[COL.price]||'—')}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">최근연락일</div>
        <div class="detail-value">${esc(r[COL.date]||'—')}</div>
      </div>
      <div class="detail-item" style="grid-column:1/-1">
        <div class="detail-label">주소</div>
        <div class="detail-value">${esc(r[COL.address]||'—')}</div>
      </div>
    </div>
    <div class="memo-section">
      <div class="memo-label">비고 / 영업 메모</div>
      <div class="memo-content ${r[COL.memo] ? '' : 'empty'}">${esc(r[COL.memo] || '내용 없음')}</div>
    </div>`;

  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

/* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let _toastT;
function showToast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast' + (type ? ' '+type : '');
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(_toastT); _toastT = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ══════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════ */
document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; render(); });

document.getElementById('filterBar').addEventListener('click', e => {
  const btn = e.target.closest('[data-filter="status"]'); if (!btn) return;
  document.querySelectorAll('[data-filter="status"]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); state.statusFilter = btn.dataset.val; render();
});

document.getElementById('itemFilter').addEventListener('click', e => {
  const btn = e.target.closest('[data-filter="item"]'); if (!btn) return;
  document.querySelectorAll('[data-filter="item"]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); state.itemFilter = btn.dataset.val; render();
});

document.getElementById('sortSel').addEventListener('change', e => { state.sort = e.target.value; render(); });

document.getElementById('refreshBtn').addEventListener('click', sync);

document.getElementById('btnBoard').addEventListener('click', () => {
  state.view = 'board';
  document.getElementById('btnBoard').classList.add('active');
  document.getElementById('btnList').classList.remove('active');
  render();
});
document.getElementById('btnList').addEventListener('click', () => {
  state.view = 'list';
  document.getElementById('btnList').classList.add('active');
  document.getElementById('btnBoard').classList.remove('active');
  render();
});

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => { if (e.target === document.getElementById('overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ══════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════ */
sync().then(() => startTimer());
</script>
