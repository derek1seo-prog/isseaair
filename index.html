<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영업 관리</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #08090a;
        --surface: #101113;
        --surface-2: #17181b;
        --surface-3: #1e2023;
        --border: #1f2124;
        --border-2: #2a2d31;
        --text: #f2f3f5;
        --text-2: #9a9ea6;
        --text-3: #5c6066;
        --white: #ffffff;
        --green: #3ddc84;
        --green-dim: rgba(61, 220, 132, 0.12);
        --red: #f66;
        --red-dim: rgba(255, 102, 102, 0.12);
        --amber: #f5b34d;
        --ring: rgba(255, 255, 255, 0.14);
        --r-xs: 5px;
        --r-sm: 8px;
        --r-md: 10px;
        --r-lg: 14px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      html {
        font-family: "Inter", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        letter-spacing: -0.006em;
      }
      button,
      input,
      textarea {
        font-family: inherit;
      }
      ::selection {
        background: rgba(255, 255, 255, 0.18);
      }

      /* ── HEADER ─────────────────────────────────── */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(8, 9, 10, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .header-in {
        max-width: 920px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 54px;
        padding: 0 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .brand-icon {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        flex-shrink: 0;
        object-fit: cover;
      }
      .brand-name {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.01em;
      }

      .search {
        flex: 1;
        max-width: 320px;
        position: relative;
      }
      .search svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        pointer-events: none;
      }
      .search input {
        width: 100%;
        height: 32px;
        padding: 0 12px 0 30px;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        font-size: 12.5px;
        color: var(--text);
        background: var(--surface);
        outline: none;
        transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s;
      }
      .search input::placeholder {
        color: var(--text-3);
      }
      .search input:focus {
        border-color: var(--border-2);
        background: var(--surface-2);
        box-shadow: 0 0 0 3px var(--ring);
      }

      .hdr-right {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        flex-shrink: 0;
      }
      .sync {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 9px;
        height: 26px;
        border-radius: var(--r-xs);
        font-size: 10.5px;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .sync-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--text-3);
        transition: background 0.3s;
      }
      .sync-dot.ok {
        background: var(--green);
      }
      .sync-dot.err {
        background: var(--red);
      }
      .sync-dot.loading {
        background: var(--amber);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .iconbtn {
        width: 30px;
        height: 30px;
        border-radius: var(--r-sm);
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
      }
      .iconbtn:hover {
        background: var(--surface-2);
        border-color: var(--border);
        color: var(--text);
      }
      .iconbtn:active {
        transform: scale(0.93);
      }
      .iconbtn.spin svg {
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── LAYOUT ──────────────────────────────────── */
      .shell {
        max-width: 920px;
        margin: 0 auto;
        padding: 22px 20px 90px;
      }

      /* ── COMPOSER ────────────────────────────────── */
      .composer {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 12px;
        margin-bottom: 22px;
        transition: border-color 0.15s var(--ease);
      }
      .composer:focus-within {
        border-color: var(--border-2);
      }
      .composer textarea {
        width: 100%;
        min-height: 56px;
        max-height: 200px;
        resize: vertical;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 12px;
        line-height: 1.65;
        padding: 4px 4px 8px;
      }
      .composer textarea::placeholder {
        color: var(--text-3);
        font-family: inherit;
      }
      .composer-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .composer-status {
        font-size: 11px;
        color: var(--text-3);
        margin-left: 2px;
        font-variant-numeric: tabular-nums;
      }

      /* ── BUTTONS ─────────────────────────────────── */
      .btn {
        appearance: none;
        border: 1px solid transparent;
        border-radius: var(--r-sm);
        font-size: 12.5px;
        font-weight: 500;
        padding: 7px 14px;
        cursor: pointer;
        transition: background 0.15s var(--ease), color 0.15s, border-color 0.15s, transform 0.1s;
        line-height: 1.2;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--white);
        color: #000;
      }
      .btn-primary:hover {
        background: #d8d8d8;
      }
      .btn-primary:disabled {
        opacity: 0.35;
        cursor: default;
        transform: none;
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-2);
        border-color: var(--border);
      }
      .btn-ghost:hover {
        background: var(--surface-2);
        border-color: var(--border-2);
        color: var(--text);
      }
      .btn-sm {
        padding: 5px 11px;
        font-size: 11.5px;
        border-radius: var(--r-xs);
      }
      .btn:focus-visible,
      .iconbtn:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }

      /* ── STATUS TABS ─────────────────────────────── */
      .status-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .status-tab {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        padding: 9px 12px;
        cursor: pointer;
        transition: border-color 0.15s var(--ease), background 0.15s;
      }
      .status-tab:hover {
        border-color: var(--border-2);
      }
      .status-tab.active {
        background: var(--surface-3);
        border-color: var(--text-3);
      }
      .status-tab.active::after {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 0;
        height: 2px;
        border-radius: 2px 2px 0 0;
        background: var(--text);
      }
      .status-tab b {
        font-size: 17px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .status-tab span {
        font-size: 10.5px;
        color: var(--text-3);
        font-weight: 500;
      }
      .status-tab.active span {
        color: var(--text-2);
      }
      .status-tab[data-status="done"] b {
        color: var(--green);
      }
      .status-tab[data-status="reject"] b {
        color: var(--red);
      }

      /* ── DATE CHIPS ──────────────────────────────── */
      .date-chip-bar {
        display: none;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        margin-bottom: 16px;
      }
      .date-chip-bar::-webkit-scrollbar {
        display: none;
      }
      .date-chip {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-3);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.12s var(--ease);
      }
      .date-chip:hover {
        color: var(--text-2);
        border-color: var(--border-2);
      }
      .date-chip.active {
        background: var(--white);
        border-color: var(--white);
        color: #000;
        font-weight: 600;
      }
      .date-chip b {
        font-weight: 600;
        opacity: 0.55;
      }
      .date-chip.active b {
        opacity: 0.5;
      }

      /* ── BUCKET PANEL ────────────────────────────── */
      .bucket-panel {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        padding: 10px 14px;
        margin-bottom: 14px;
      }
      .bucket-panel strong {
        font-size: 12.5px;
        font-weight: 600;
      }
      .bucket-panel span {
        font-size: 11.5px;
        color: var(--text-3);
        margin-left: 4px;
      }
      .bucket-actions {
        display: flex;
        gap: 6px;
      }

      /* ── GRID / DIVIDER ──────────────────────────── */
      .scan-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
        gap: 8px;
      }
      .divider {
        grid-column: 1 / -1;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 14px 2px 6px;
      }
      .divider:first-child {
        padding-top: 0;
      }
      .divider-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        font-family: inherit;
        transition: color 0.12s;
      }
      .divider-label:hover {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .divider-count {
        font-size: 11px;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }

      /* ── CARD ────────────────────────────────────── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 2px solid var(--border);
        border-radius: var(--r-md);
        padding: 11px 12px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        animation: cardIn 0.24s var(--ease) both;
        transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card:hover {
        border-color: var(--border-2);
        background: var(--surface-2);
      }
      .card.status-done {
        border-left-color: var(--green);
      }
      .card.status-reject {
        border-left-color: var(--red);
      }
      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .card-title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--text);
      }
      .card-time {
        flex-shrink: 0;
        font-size: 10.5px;
        color: var(--text-3);
        white-space: nowrap;
        margin-top: 1px;
        font-variant-numeric: tabular-nums;
      }
      .senior-flag {
        display: inline-block;
        font-size: 10px;
        color: var(--red);
        font-weight: 500;
      }
      .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 12px;
      }
      .meta-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11.5px;
        color: var(--text-2);
        max-width: 100%;
        min-width: 0;
      }
      .meta-item svg {
        flex-shrink: 0;
        color: var(--text-3);
      }
      .meta-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-note {
        border-top: 1px dashed transparent;
      }
      .card-note.has-note {
        border-top-color: var(--border);
        padding-top: 6px;
      }
      .note-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .note-toggle {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: none;
        background: transparent;
        color: var(--text-3);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: color 0.12s, background 0.12s;
      }
      .note-toggle:hover {
        background: var(--surface-3);
        color: var(--text-2);
      }
      .has-note .note-toggle {
        color: var(--amber);
      }
      .note-preview {
        font-size: 11.5px;
        color: var(--text-2);
        font-style: italic;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }
      .note-editor {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.18s var(--ease);
      }
      .card-note.open .note-editor {
        grid-template-rows: 1fr;
        margin-top: 6px;
      }
      .note-editor-inner {
        overflow: hidden;
      }
      .note-editor textarea {
        width: 100%;
        min-height: 48px;
        resize: none;
        border: 1px solid var(--border-2);
        border-radius: var(--r-xs);
        background: var(--bg);
        color: var(--text);
        font-size: 11.5px;
        line-height: 1.5;
        padding: 6px 8px;
        outline: none;
      }
      .note-editor textarea:focus {
        border-color: var(--text-3);
      }
      .card-note.open .note-preview {
        display: none;
      }

      .card-foot {
        display: flex;
        gap: 4px;
        margin-top: 1px;
      }
      .card-act {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 5px 4px;
        border-radius: var(--r-xs);
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-2);
        font-size: 11px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.12s var(--ease);
      }
      .card-act:hover {
        background: var(--surface-3);
        border-color: var(--border-2);
        color: var(--text);
      }
      .card-act[data-act="reject"].active {
        background: var(--red-dim);
        border-color: rgba(255, 102, 102, 0.35);
        color: var(--red);
      }
      .card-act[data-act="done"].active {
        background: var(--green-dim);
        border-color: rgba(61, 220, 132, 0.35);
        color: var(--green);
      }
      .card-act[data-act="del"]:hover {
        background: var(--red-dim);
        border-color: rgba(255, 102, 102, 0.35);
        color: var(--red);
      }
      .card-act:disabled {
        opacity: 0.35;
        cursor: default;
      }

      /* ── EMPTY / SENTINEL ────────────────────────── */
      .empty-state {
        display: none;
        text-align: center;
        padding: 70px 20px;
      }
      .empty-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-2);
        margin-bottom: 4px;
      }
      .empty-desc {
        font-size: 12px;
        color: var(--text-3);
      }
      .sentinel {
        height: 1px;
      }

      /* ── TOOLS (collapsed utility drawer) ─────────── */
      .tools {
        margin-top: 36px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .tool {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 10px 14px;
      }
      .tool summary {
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text-3);
        cursor: pointer;
        user-select: none;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.12s;
      }
      .tool summary:hover {
        color: var(--text-2);
      }
      .tool summary::-webkit-details-marker {
        display: none;
      }
      .tool summary::before {
        content: "";
        width: 5px;
        height: 5px;
        border-right: 1.5px solid var(--text-3);
        border-bottom: 1.5px solid var(--text-3);
        transform: rotate(-45deg);
        transition: transform 0.18s var(--ease);
        flex-shrink: 0;
      }
      .tool[open] summary::before {
        transform: rotate(45deg);
      }
      .tool summary b {
        color: var(--text-3);
        font-weight: 400;
      }
      .tool-body {
        margin-top: 12px;
        animation: cardIn 0.18s var(--ease) both;
      }
      .tool-cap {
        font-size: 11px;
        color: var(--text-3);
        margin-bottom: 10px;
        line-height: 1.6;
      }
      .bkmk-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .bkmk-btn {
        display: inline-flex;
        align-items: center;
        padding: 6px 13px;
        border-radius: var(--r-xs);
        background: var(--surface-3);
        color: var(--text);
        border: 1px solid var(--border-2);
        font-size: 11.5px;
        font-weight: 500;
        text-decoration: none;
        cursor: grab;
        user-select: none;
        transition: background 0.12s;
      }
      .bkmk-btn:hover {
        background: #262a2e;
      }
      .field-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .field {
        flex: 1;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: var(--r-xs);
        font-size: 12px;
        color: var(--text);
        background: var(--bg);
        outline: none;
        transition: border-color 0.12s;
      }
      .field:focus {
        border-color: var(--border-2);
      }
      .field::placeholder {
        color: var(--text-3);
      }
      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 6px 3px 10px;
        border-radius: 999px;
        background: var(--red-dim);
        color: var(--red);
        border: 1px solid rgba(255, 102, 102, 0.3);
        font-size: 11.5px;
        font-weight: 500;
      }
      .tag button {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 102, 102, 0.2);
        color: var(--red);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        line-height: 1;
        padding: 0;
      }
      .tag button:hover {
        background: var(--red);
        color: #000;
      }
      .tag-empty {
        font-size: 11.5px;
        color: var(--text-3);
      }
      .extract-out {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--r-xs);
        padding: 8px 10px;
        font-size: 11px;
        color: var(--text-2);
        max-height: 180px;
        overflow-y: auto;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        margin-top: 8px;
      }
      .row-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      /* ── TOAST ───────────────────────────────────── */
      .toast-wrap {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 900;
        pointer-events: none;
      }
      .toast {
        background: rgba(23, 24, 27, 0.92);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border-2);
        color: var(--text);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 500;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translateY(6px) scale(0.98);
        transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      .toast.warn {
        background: var(--red);
        border-color: var(--red);
        color: #1a0000;
      }
      .toast.ok {
        background: var(--green);
        border-color: var(--green);
        color: #002611;
      }

      /* ── RESPONSIVE ──────────────────────────────── */
      @media (max-width: 640px) {
        .header-in {
          padding: 0 14px;
          gap: 10px;
        }
        .brand-name {
          display: none;
        }
        .search {
          max-width: none;
        }
        .shell {
          padding: 16px 14px 90px;
        }
        .status-tab b {
          font-size: 15px;
        }
        .scan-grid {
          grid-template-columns: 1fr;
        }
        .lock-box {
          width: 88vw;
          padding: 30px 22px 26px;
        }
        .pin-keypad {
          grid-template-columns: repeat(3, 62px);
          gap: 8px;
        }
        .pin-key {
          height: 46px;
        }
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-2);
        border-radius: 99px;
      }

      /* ── LOCK SCREEN ─────────────────────────────── */
      .lock-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lock-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 38px 34px 34px;
        width: 300px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .lock-logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
      }
      .lock-title {
        font-size: 14.5px;
        font-weight: 600;
        color: var(--text);
        margin-top: -6px;
      }
      .pin-dots {
        display: flex;
        gap: 13px;
        margin: 2px 0;
      }
      .pin-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        border: 1.5px solid var(--border-2);
        background: transparent;
        transition: all 0.15s var(--ease);
      }
      .pin-dot.filled {
        background: var(--white);
        border-color: var(--white);
        transform: scale(1.1);
      }
      .pin-dot.error {
        background: var(--red);
        border-color: var(--red);
      }
      .pin-keypad {
        display: grid;
        grid-template-columns: repeat(3, 68px);
        gap: 9px;
      }
      .pin-key {
        height: 50px;
        border-radius: var(--r-sm);
        border: 1px solid var(--border);
        background: var(--surface-2);
        font-size: 17px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        transition: all 0.1s var(--ease);
      }
      .pin-key:hover {
        background: var(--surface-3);
        border-color: var(--border-2);
      }
      .pin-key:active {
        transform: scale(0.95);
      }
      .pin-key.del {
        font-size: 13px;
        color: var(--text-3);
      }
      .lock-error {
        font-size: 11.5px;
        color: var(--red);
        height: 14px;
      }
    </style>
  </head>
  <body>
    <!-- ── LOCK SCREEN ───────────────────────────────────── -->
    <div class="lock-screen" id="lockScreen">
      <div class="lock-box">
        <img class="lock-logo" src="logo.png" alt="" />
        <div class="lock-title">영업 관리</div>
        <div class="pin-dots" id="pinDots">
          <div class="pin-dot" id="d0"></div>
          <div class="pin-dot" id="d1"></div>

        <div class="lock-error" id="lockError"></div>
        <div class="pin-keypad">
          <button class="pin-key" data-k="1">1</button>
          <button class="pin-key" data-k="2">2</button>
          <button class="pin-key" data-k="3">3</button>
          <button class="pin-key" data-k="4">4</button>
          <button class="pin-key" data-k="5">5</button>
          <button class="pin-key" data-k="6">6</button>
          <button class="pin-key" data-k="7">7</button>
          <button class="pin-key" data-k="8">8</button>

    <!-- ── HEADER ──────────────────────────────────────── -->
    <header class="header">
      <div class="header-in">
        <div class="brand">
          <img class="brand-icon" src="logo.png" alt="" />
          <span class="brand-name">영업 관리</span>
        </div>
        <div class="search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input id="searchInput" type="text" placeholder="검색" autocomplete="off" />
        </div>
        <div class="hdr-right">
          <div class="sync">
            <div class="sync-dot" id="syncDot"></div>
            <span id="syncText">—</span>
          </div>
          <button class="iconbtn" id="refreshBtn" title="새로고침">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M8 16H3v5" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="shell">
      <!-- 링크 입력 -->
      <div class="composer">
        <textarea id="scanUrlInput" placeholder="상품 링크 붙여넣기 (줄바꿈 구분)"></textarea>
        <div class="composer-bar">
          <button class="btn btn-primary btn-sm" id="scanBtn">분석</button>
          <button class="btn btn-ghost btn-sm" id="dedupScanBtn">중복 정리</button>

        </div>
      </div>

      <!-- 상태 / 통계 -->
      <div class="status-tabs" id="statusTabs"></div>

      <!-- 날짜 -->
      <div class="date-chip-bar" id="dateChips"></div>

      <!-- 선택된 버킷 패널 -->
      <div class="bucket-panel" id="bucketPanel"></div>

      <!-- 결과 -->
      <div class="scan-grid" id="scanResults"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-title" id="emptyTitle">항목 없음</div>
        <div class="empty-desc" id="emptyDesc"></div>
      </div>
      <div class="sentinel" id="scrollSentinel"></div>

      <!-- 도구 -->
      <div class="tools">
        <details class="tool" id="bkmkSection">
          <summary>북마클릿</summary>
          <div class="tool-body">
            <div class="tool-cap">드래그해서 북마크바에 설치 · SSG 상품/검색 페이지에서 클릭</div>
            <div class="bkmk-row">
              <a id="bkmkSaveBtn" class="bkmk-btn" draggable="true">상품 저장</a>
              <a id="bkmkExtractBtn" class="bkmk-btn" draggable="true">링크 추출</a>
            </div>
          </div>
        </details>

        <details class="tool" id="blockedSection">
          <summary>차단 거래처 <b id="blockedCount"></b></summary>
          <div class="tool-body">
            <div class="tool-cap">일치하는 제조사/업체명은 자동 불가 처리</div>
            <div class="field-row">
              <input id="blockedInput" class="field" type="text" placeholder="업체명" />
              <button class="btn btn-ghost btn-sm" id="blockedAddBtn">추가</button>
            </div>
            <div class="tag-list" id="blockedTags"></div>
          </div>
        </details>

        <details class="tool" id="extractSection">
          <summary>링크 추출기</summary>
          <div class="tool-body">
            <div class="field-row">
              <input id="extractUrlInput" class="field" type="text" placeholder="검색결과 URL" />
              <button class="btn btn-primary btn-sm" id="extractBtn">추출</button>
            </div>
            <div class="row-actions">
              <button class="btn btn-ghost btn-sm" id="extractCopyBtn" style="display:none">전체 복사</button>
              <button class="btn btn-ghost btn-sm" id="extractToScanBtn" style="display:none">입력창에 추가</button>
              <span id="extractStatus" style="font-size:11.5px;color:var(--text-3)"></span>
            </div>
            <div id="extractResult" class="extract-out" style="display:none"></div>
          </div>
        </details>
      </div>
    </div>

    <div class="toast-wrap"><div class="toast" id="toast"></div></div>

    <script>
      /* ══════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════ */
      /* ── Google Apps Script 배포 ────────────────────────────
   확장 프로그램 → Apps Script → 코드 붙여넣기 → 배포(웹앱, 나/모든 사용자) → URL을 APPS_SCRIPT_URL에 설정

   function doGet(e) {
     if (e.parameter.action === 'scrape') return scrapeProduct(e.parameter.url);
     if (e.parameter.action === 'extractLinks') return extractLinks(e.parameter.url);
     if (e.parameter.action === 'saveToEmart') return saveToEmart(e.parameter);
     if (e.parameter.action === 'getEmartItems') return getEmartItems();
     if (e.parameter.action === 'updateEmartStatus') return updateEmartStatus(e.parameter);
     return res({success:false, error:'알 수 없는 요청'});
   }
   function saveToEmart(p) {
     try {
       const ss = SpreadsheetApp.getActiveSpreadsheet();
       let sheet = ss.getSheetByName('emart');
       if (!sheet) sheet = ss.insertSheet('emart');
       if (sheet.getLastRow() === 0) {
         sheet.appendRow(['URL', '품명', '제조사/수입자', '제조국', '전화번호', '스캔일시', '상태']);
         sheet.getRange(1,1,1,7).setFontWeight('bold').setBackground('#f1f5f9');
       }
       sheet.appendRow([p.url||'', p['품명']||'', p['제조사수입자']||'', p['제조국']||'', p['전화번호']||'', p.addedAt||'', '']);
       return res({success: true});
     } catch(e) { return res({success: false, error: e.message}); }
   }
   function getEmartItems() {
     try {
       const ss = SpreadsheetApp.getActiveSpreadsheet();
       const sheet = ss.getSheetByName('emart');
       if (!sheet || sheet.getLastRow() < 2) return res({success: true, items: []});
       const cols = Math.max(sheet.getLastColumn(), 7);
       const rows = sheet.getRange(2, 1, sheet.getLastRow()-1, cols).getValues();
       const items = rows.map(r => ({
         url: r[0]||'', 품명: r[1]||'', 제조사수입자: r[2]||'', 제조국: r[3]||'', 전화번호: r[4]||'', addedAt: r[5]||'', scanStatus: r[6]||''
       })).filter(i => i.url);
       return res({success: true, items});
     } catch(e) { return res({success: false, error: e.message}); }
   }
   function updateEmartStatus(p) {
     try {
       const ss = SpreadsheetApp.getActiveSpreadsheet();
       const sheet = ss.getSheetByName('emart');
       if (!sheet || sheet.getLastRow() < 2) return res({success: false, error: 'emart 시트 없음'});
       const urls = sheet.getRange(2, 1, sheet.getLastRow()-1, 1).getValues();
       let found = -1;
       for (let i = 0; i < urls.length; i++) { if (urls[i][0] === p.url) { found = i+2; break; } }
       if (found < 0) return res({success: false, error: '행을 찾지 못함'});
       if (sheet.getLastColumn() < 7) sheet.getRange(1,7).setValue('상태');
       sheet.getRange(found, 7).setValue(p.status || '');
       return res({success: true});
     } catch(e) { return res({success: false, error: e.message}); }
   }
   function extractLinks(url) {
     try {
       const html = UrlFetchApp.fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0', 'Accept-Language': 'ko-KR,ko;q=0.9' }, muteHttpExceptions: true, followRedirects: true }).getContentText('UTF-8');
       const ndm = html.match(/<script id="__NEXT_DATA__" type="application\/json">([^<]+)<\/script>/);
       if (ndm) {
         const jsonStr = ndm[1]; const seen = new Set(); const links = [];
         const itemRe = /"itemId":"(\d+)"/g; let m;
         while ((m = itemRe.exec(jsonStr)) !== null) {
           const itemId = m[1]; if (seen.has(itemId)) continue; seen.add(itemId);
           const chunk = jsonStr.substring(Math.max(0, m.index - 100), m.index + 200);
           const snm = chunk.match(/"siteNo":"(\d+)"/); const siteNo = snm ? snm[1] : '6001';
           links.push('https://emart.ssg.com/item/itemView.ssg?itemId=' + itemId + '&siteNo=' + siteNo);
         }
         if (links.length > 0) return res({success: true, links: links});
       }
       return res({success: false, error: '링크를 찾지 못함'});
     } catch(e) { return res({success: false, error: e.message}); }
   }
   function scrapeProduct(url) {
     try {
       const html = UrlFetchApp.fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0', 'Accept-Language': 'ko-KR,ko;q=0.9' }, muteHttpExceptions: true, followRedirects: true }).getContentText('UTF-8');
       const data = {
         품명: fld(html, ['품명 및 모델명','품명','상품명','제품명']),
         제조사수입자: fld(html, ['제조사/수입자','제조사 및 수입자','제조사','수입자','브랜드']),
         제조국: fld(html, ['제조국','원산지','생산국','제조 국가']),
         전화번호: phone(fld(html, ['A/S 책임자 및 전화번호','고객센터','A/S 연락처','전화번호','고객센터 전화번호'])),
       };
       return res({success:true, data:data});
     } catch(e) { return res({success:false, error:e.message}); }
   }
   function fld(html, keys) {
     for (const key of keys) {
       const k = key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\//g,'[/／]');
       for (const [op,cl] of [['th','td'],['dt','dd'],['strong','span'],['b','td']]) {
         const m = html.match(new RegExp('<'+op+'[^>]*>[\\s\\S]{0,150}'+k+'[\\s\\S]{0,150}</'+op+'>[\\s\\S]{0,400}?<'+cl+'[^>]*>([\\s\\S]{0,800}?)</'+cl+'>'));
         if (m) { const v = m[1].replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim(); if (v && v.length < 300) return v; }
       }
     }
     return '';
   }
   function phone(text) { if (!text) return ''; const m = text.match(/0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}/); return m ? m[0].replace(/[.\s]/g,'-') : text.slice(0,30); }
   function res(d) { return ContentService.createTextOutput(JSON.stringify(d)).setMimeType(ContentService.MimeType.JSON); }
   ────────────────────────────────────────────────────── */
      const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwfxzELul4VddxeCBIZ0_EgU7nSF9e84R87ZktbsD1obcgShMaWWSCuZYXpRP2AjduE1w/exec";

      /* ══════════════════════════════════════════════════════
   STATE / STORAGE
   ══════════════════════════════════════════════════════ */
      let scannedItems = (() => {
        try { return JSON.parse(localStorage.getItem("isseaair_scan") || "[]"); } catch { return []; }
      })();
      let blockedCompanies = (() => {
        try { return JSON.parse(localStorage.getItem("isseaair_blocked") || "[]"); } catch { return []; }
      })();
      let notes = (() => {
        try { return JSON.parse(localStorage.getItem("isseaair_notes") || "{}"); } catch { return {}; }
      })();

      const state = { search: "", bucket: null, status: "all" };
      const renderCtl = { list: [], shown: 0, batch: 24, lastBucketKey: null, loading: false };

      function saveScan() { localStorage.setItem("isseaair_scan", JSON.stringify(scannedItems)); }
      function saveBlocked() { localStorage.setItem("isseaair_blocked", JSON.stringify(blockedCompanies)); }
      function saveNotes() { localStorage.setItem("isseaair_notes", JSON.stringify(notes)); }
      function getNote(url) { return notes[url] || ""; }
      function setNote(url, val) {
        if (val) notes[url] = val; else delete notes[url];
        saveNotes();
      }

      /* ── 차단 거래처 ─────────────────────────────────── */
      function normComp(n) { return String(n || "").trim().replace(/\s+/g, " ").toLowerCase(); }
      function isSeniorCompany(item) {
        const mfr = normComp(item.제조사수입자);
        const name = normComp(item.품명);
        return blockedCompanies.some((b) => {
          const nb = normComp(b);
          if (!nb) return false;
          return mfr.includes(nb) || nb.includes(mfr) || name.includes(nb);
        });
      }
      function renderBlockedTags() {
        const wrap = document.getElementById("blockedTags");
        const countEl = document.getElementById("blockedCount");
        if (!wrap) return;
        if (!blockedCompanies.length) {
          wrap.innerHTML = '<span class="tag-empty">없음</span>';
          if (countEl) countEl.textContent = "";
          return;
        }
        if (countEl) countEl.textContent = blockedCompanies.length;
        wrap.innerHTML = blockedCompanies
          .map((b, i) => `<span class="tag">${esc(b)}<button onclick="removeBlocked(${i})">×</button></span>`)
          .join("");
      }
      function addBlocked() {
        const inp = document.getElementById("blockedInput");
        const val = inp.value.trim();
        if (!val) return;
        if (blockedCompanies.some((b) => normComp(b) === normComp(val))) {
          showToast("이미 등록됨", "warn");
          return;
        }
        blockedCompanies.push(val);
        saveBlocked();
        renderBlockedTags();
        inp.value = "";
        resetRender();
      }
      function removeBlocked(i) {
        blockedCompanies.splice(i, 1);
        saveBlocked();
        renderBlockedTags();
        resetRender();
      }

      /* ══════════════════════════════════════════════════════
   날짜 버킷
   ══════════════════════════════════════════════════════ */
      function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
      function bucketOf(iso) {
        const d = iso ? new Date(iso) : new Date();
        if (isNaN(d.getTime())) return { key: "unknown", label: "미상", rank: 9999 };
        const diff = Math.round((dayStart(new Date()) - dayStart(d)) / 86400000);
        if (diff <= 0) return { key: "d0", label: "오늘", rank: 0 };
        if (diff === 1) return { key: "d1", label: "어제", rank: 1 };
        if (diff < 7) return { key: "d" + diff, label: diff + "일 전", rank: diff };
        if (diff < 30) { const w = Math.floor(diff / 7); return { key: "w" + w, label: w + "주 전", rank: 8 + w }; }
        const m = Math.floor(diff / 30);
        if (m < 12) return { key: "m" + m, label: m + "개월 전", rank: 100 + m };
        const y = Math.floor(m / 12);
        return { key: "y" + y, label: y + "년 전", rank: 1000 + y };
      }
      function exactDateTime(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return "";
        const p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      /* ══════════════════════════════════════════════════════
   FILTER PIPELINE
   ══════════════════════════════════════════════════════ */
      function searchScoped() {
        const q = state.search.trim().toLowerCase();
        if (!q) return scannedItems;
        return scannedItems.filter(
          (i) =>
            (i.품명 || "").toLowerCase().includes(q) ||
            (i.제조사수입자 || "").toLowerCase().includes(q) ||
            (i.전화번호 || "").includes(q)
        );
      }
      function bucketScoped() {
        const list = searchScoped();
        if (!state.bucket) return list;
        return list.filter((i) => bucketOf(i.addedAt).key === state.bucket);
      }
      function statusOf(item) {
        if (isSeniorCompany(item)) return "reject";
        if (item.scanStatus === "완료") return "done";
        if (item.scanStatus === "불가") return "reject";
        return "pending";
      }
      function finalList() {
        const list = bucketScoped();
        if (state.status === "all") return list;
        return list.filter((i) => statusOf(i) === state.status);
      }

      /* ══════════════════════════════════════════════════════
   RENDER — 상태 탭
   ══════════════════════════════════════════════════════ */
      function renderStatusTabs() {
        const list = bucketScoped();
        const counts = { all: list.length, pending: 0, done: 0, reject: 0 };
        list.forEach((i) => counts[statusOf(i)]++);
        const defs = [
          ["all", "전체"],
          ["pending", "미처리"],
          ["done", "완료"],
          ["reject", "불가"],
        ];
        document.getElementById("statusTabs").innerHTML = defs
          .map(
            ([key, label]) =>
              `<button class="status-tab${state.status === key ? " active" : ""}" data-status="${key}"><b>${counts[key]}</b><span>${label}</span></button>`
          )
          .join("");
      }

      /* ── 날짜 칩 ─────────────────────────────────────── */
      function renderChips() {
        const wrap = document.getElementById("dateChips");
        if (!scannedItems.length) {
          wrap.style.display = "none";
          wrap.innerHTML = "";
          return;
        }
        wrap.style.display = "flex";
        const list = searchScoped();
        const groups = {};
        list.forEach((i) => {
          const b = bucketOf(i.addedAt);
          (groups[b.key] = groups[b.key] || { label: b.label, rank: b.rank, count: 0 }).count++;
        });
        const keys = Object.keys(groups).sort((a, b) => groups[a].rank - groups[b].rank);
        const chips = [
          `<button class="date-chip${!state.bucket ? " active" : ""}" data-bucket="">전체 <b>${list.length}</b></button>`,
        ];
        keys.forEach((k) => {
          chips.push(
            `<button class="date-chip${state.bucket === k ? " active" : ""}" data-bucket="${k}">${groups[k].label} <b>${groups[k].count}</b></button>`
          );
        });
        wrap.innerHTML = chips.join("");
      }

      /* ── 버킷 패널 ───────────────────────────────────── */
      function renderBucketPanel(list) {
        const panel = document.getElementById("bucketPanel");
        if (!state.bucket) {
          panel.style.display = "none";
          return;
        }
        const b = bucketOf(
          (scannedItems.find((i) => bucketOf(i.addedAt).key === state.bucket) || {}).addedAt
        );
        panel.style.display = "flex";
        const statusLabel = { pending: " · 미처리", done: " · 완료", reject: " · 불가" }[state.status] || "";
        panel.innerHTML = `
          <div><strong>${esc(b.label || "")}${statusLabel}</strong><span>${list.length}건</span></div>
          <div class="bucket-actions">
            <button class="btn btn-ghost btn-sm" onclick="copyCurrentList()">목록 복사</button>
            <button class="btn btn-ghost btn-sm" onclick="setBucket(null)">해제</button>
          </div>`;
      }

      /* ══════════════════════════════════════════════════════
   RENDER — 카드 / 무한스크롤
   ══════════════════════════════════════════════════════ */
      const ICON = {
        factory:
          '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M4 20V10l6 4v-4l6 4V6l4 3v11H4z"/></svg>',
        pin:
          '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
        phone:
          '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.65 3.44 2 2 0 0 1 3.62 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6.13 6.13l.56-.56a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
        note:
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
      };

      function cardHTML(item) {
        const url = item.url || "";
        const urlEnc = esc(url);
        const senior = isSeniorCompany(item);
        const st = senior ? "reject" : statusOf(item);
        const b = bucketOf(item.addedAt);
        const note = getNote(url);
        return `<div class="card status-${st}" data-url="${urlEnc}">
          <div class="card-head">
            <div class="card-title">${esc(item.품명 || "품명 미확인")}</div>
            <div class="card-time" title="${esc(exactDateTime(item.addedAt))}">${esc(b.label)}</div>
          </div>
          ${senior ? '<div class="senior-flag">차단 거래처</div>' : ""}
          <div class="card-meta">
            <span class="meta-item">${ICON.factory}<span title="${esc(item.제조사수입자 || "")}">${esc(item.제조사수입자 || "—")}</span></span>
            <span class="meta-item">${ICON.pin}<span>${esc(item.제조국 || "—")}</span></span>
            <span class="meta-item">${ICON.phone}<span>${esc(item.전화번호 || "—")}</span></span>
          </div>
          <div class="card-note${note ? " has-note" : ""}">
            <div class="note-row">
              <button class="note-toggle" onclick="toggleNote(this)" title="메모">${ICON.note}</button>
              <div class="note-preview" onclick="toggleNote(this.parentElement.querySelector('.note-toggle'))">${esc(note)}</div>
            </div>
            <div class="note-editor"><div class="note-editor-inner">
              <textarea placeholder="메모" oninput="onNoteInput(this,'${urlEnc}')">${esc(note)}</textarea>
            </div></div>
          </div>
          <div class="card-foot">
            <a href="${urlEnc}" target="_blank" rel="noopener" class="card-act">열기</a>
            <button class="card-act" data-act="reject" onclick="setScanStatus('${urlEnc}','불가')" ${senior ? "disabled" : ""}>불가</button>
            <button class="card-act" data-act="done" onclick="setScanStatus('${urlEnc}','완료')" ${senior ? "disabled" : ""}>완료</button>
            <button class="card-act" data-act="del" onclick="deleteScanItem('${urlEnc}')">삭제</button>
          </div>
        </div>`;
      }

      function syncCardButtons(item) {
        const url = item.url || "";
        const card = document.querySelector(`.card[data-url="${CSS.escape(url)}"]`);
        if (!card) return;
        const senior = isSeniorCompany(item);
        const st = senior ? "reject" : statusOf(item);
        card.className = "card status-" + st;
        const rejectBtn = card.querySelector('[data-act="reject"]');
        const doneBtn = card.querySelector('[data-act="done"]');
        rejectBtn.classList.toggle("active", st === "reject" && !senior);
        doneBtn.classList.toggle("active", st === "done");
      }

      function dividerHTML(b, count) {
        return `<div class="divider"><button class="divider-label" onclick="setBucket('${esc(b.key)}')">${esc(b.label)}</button><span class="divider-count">${count}개</span></div>`;
      }

      function toEl(html) {
        const t = document.createElement("template");
        t.innerHTML = html.trim();
        return t.content.firstElementChild;
      }

      function renderMore() {
        const container = document.getElementById("scanResults");
        const list = renderCtl.list;
        const start = renderCtl.shown;
        const end = Math.min(start + renderCtl.batch, list.length);
        if (start >= end) return;

        // 배치 내 버킷별 개수 미리 계산 (구분선용)
        const frag = document.createDocumentFragment();
        for (let idx = start; idx < end; idx++) {
          const item = list[idx];
          const b = bucketOf(item.addedAt);
          if (!state.bucket && b.key !== renderCtl.lastBucketKey) {
            const count = list.filter((x) => bucketOf(x.addedAt).key === b.key).length;
            frag.appendChild(toEl(dividerHTML(b, count)));
            renderCtl.lastBucketKey = b.key;
          }
          frag.appendChild(toEl(cardHTML(item)));
        }
        container.appendChild(frag);
        renderCtl.shown = end;
      }

      function resetRender() {
        renderChips();
        renderStatusTabs();
        const list = finalList().slice().sort((a, b) => (b.addedAt || "").localeCompare(a.addedAt || ""));
        renderCtl.list = list;
        renderCtl.shown = 0;
        renderCtl.lastBucketKey = null;

        renderBucketPanel(list);

        const container = document.getElementById("scanResults");
        const empty = document.getElementById("emptyState");
        container.innerHTML = "";

        if (!scannedItems.length) {
          container.style.display = "none";
          empty.style.display = "block";
          document.getElementById("emptyTitle").textContent = "항목 없음";
          document.getElementById("emptyDesc").textContent = "링크를 붙여넣고 분석을 시작하세요";
          return;
        }
        if (!list.length) {
          container.style.display = "none";
          empty.style.display = "block";
          document.getElementById("emptyTitle").textContent = "결과 없음";
          document.getElementById("emptyDesc").textContent = "";
          return;
        }
        container.style.display = "grid";
        empty.style.display = "none";
        renderMore();
      }

      function setBucket(key) {
        state.bucket = state.bucket === key ? null : key || null;
        resetRender();
      }

      function copyCurrentList() {
        const items = renderCtl.list;
        if (!items.length) { showToast("항목 없음", "warn"); return; }
        const lines = items.map((i) => [i.품명 || "", i.제조사수입자 || "", i.전화번호 || "", i.url || ""].join("\t"));
        navigator.clipboard
          .writeText(lines.join("\n"))
          .then(() => showToast(`${items.length}건 복사됨`, "ok"))
          .catch(() => showToast("복사 실패", "warn"));
      }

      /* ── 메모 ────────────────────────────────────────── */
      function toggleNote(btn) {
        const wrap = btn.closest(".card-note");
        wrap.classList.toggle("open");
        if (wrap.classList.contains("open")) {
          const ta = wrap.querySelector("textarea");
          ta.focus();
          const v = ta.value;
          ta.setSelectionRange(v.length, v.length);
        }
      }
      let _noteTimers = {};
      function onNoteInput(ta, url) {
        clearTimeout(_noteTimers[url]);
        const val = ta.value;
        _noteTimers[url] = setTimeout(() => {
          setNote(url, val.trim());
          const wrap = ta.closest(".card-note");
          wrap.classList.toggle("has-note", !!val.trim());
          wrap.querySelector(".note-preview").textContent = val.trim();
        }, 350);
      }

      /* ══════════════════════════════════════════════════════
   SCAN — 상품 분석
   ══════════════════════════════════════════════════════ */
      function normPhone(p) {
        if (!p) return "";
        const digits = String(p).replace(/[^0-9]/g, "");
        if (digits.length >= 7) return digits;
        return String(p).replace(/[\s\-().]/g, "").toLowerCase();
      }
      function normMfr(n) { return n ? String(n).trim().replace(/\s+/g, " ").toLowerCase() : ""; }
      function isDuplicate(item, list) {
        const phone = normPhone(item.전화번호);
        const mfr = normMfr(item.제조사수입자);
        return list.some((x) => {
          if (phone && phone.length >= 7 && normPhone(x.전화번호) === phone) return true;
          if (mfr && normMfr(x.제조사수입자) === mfr) return true;
          return false;
        });
      }
      function deduplicateExisting() {
        const before = scannedItems.length;
        const deduped = [];
        scannedItems.forEach((item) => { if (!isDuplicate(item, deduped)) deduped.push(item); });
        scannedItems = deduped;
        saveScan();
        resetRender();
        const removed = before - scannedItems.length;
        showToast(removed > 0 ? `중복 ${removed}개 제거됨` : "중복 없음", removed > 0 ? "ok" : "");
      }

      async function runScan() {
        const ta = document.getElementById("scanUrlInput");
        const urls = ta.value.split("\n").map((u) => u.trim()).filter((u) => /^https?:\/\//.test(u));
        if (!urls.length) { showToast("URL을 입력하세요", "warn"); return; }
        if (!APPS_SCRIPT_URL) { showToast("APPS_SCRIPT_URL 미설정", "warn"); return; }

        const btn = document.getElementById("scanBtn");
        const prog = document.getElementById("scanProgress");
        btn.disabled = true;
        let ok = 0, fail = 0, dup = 0;

        for (let i = 0; i < urls.length; i++) {
          const url = urls[i];
          prog.textContent = `${i + 1}/${urls.length}`;
          try {
            const api = new URL(APPS_SCRIPT_URL);
            api.searchParams.set("action", "scrape");
            api.searchParams.set("url", url);
            const res = await fetch(api.toString());
            const json = await res.json();
            if (json.success && json.data) {
              const item = { ...json.data, url, addedAt: new Date().toISOString(), scanStatus: "" };
              if (scannedItems.some((x) => x.url === url) || isDuplicate(item, scannedItems)) { dup++; continue; }
              scannedItems.push(item);
              saveItemToSheet(item);
              ok++;
            } else {
              fail++;
            }
          } catch (e) {
            fail++;
          }
        }

        saveScan();
        ta.value = "";
        prog.textContent = ok || dup || fail ? `신규 ${ok}${dup ? ` · 중복 ${dup}` : ""}${fail ? ` · 실패 ${fail}` : ""}` : "";
        btn.disabled = false;
        state.bucket = null;
        resetRender();
      }

      async function setScanStatus(url, newStatus) {
        const item = scannedItems.find((x) => x.url === url);
        if (!item) return;
        item.scanStatus = item.scanStatus === newStatus ? "" : newStatus;
        saveScan();
        syncCardButtons(item);
        renderStatusTabs();
        if (state.status !== "all" && statusOf(item) !== state.status) resetRender();
        if (!APPS_SCRIPT_URL) return;
        try {
          const api = new URL(APPS_SCRIPT_URL);
          api.searchParams.set("action", "updateEmartStatus");
          api.searchParams.set("url", url);
          api.searchParams.set("status", item.scanStatus);
          await fetch(api.toString());
        } catch (e) {}
      }

      async function saveItemToSheet(item) {
        if (!APPS_SCRIPT_URL) return;
        try {
          const api = new URL(APPS_SCRIPT_URL);
          api.searchParams.set("action", "saveToEmart");
          api.searchParams.set("url", item.url || "");
          api.searchParams.set("품명", item.품명 || "");
          api.searchParams.set("제조사수입자", item.제조사수입자 || "");
          api.searchParams.set("제조국", item.제조국 || "");
          api.searchParams.set("전화번호", item.전화번호 || "");
          api.searchParams.set("addedAt", item.addedAt || "");
          await fetch(api.toString());
        } catch (e) {}
      }

      function deleteScanItem(url) {
        scannedItems = scannedItems.filter((i) => i.url !== url);
        setNote(url, "");
        saveScan();
        resetRender();
      }
      function clearAllScan() {
        if (!confirm(`${scannedItems.length}건을 모두 삭제할까요?`)) return;
        scannedItems = [];
        saveScan();
        state.bucket = null;
        resetRender();
      }

      async function loadEmartItems() {
        if (!APPS_SCRIPT_URL) return { added: 0, statusUpdated: 0 };
        const url = new URL(APPS_SCRIPT_URL);
        url.searchParams.set("action", "getEmartItems");
        const res = await fetch(url.toString());
        const json = await res.json();
        if (!json.success) throw new Error(json.error || "불러오기 실패");
        let added = 0, statusUpdated = 0;
        (json.items || []).forEach((sheetItem) => {
          const existing = scannedItems.find((x) => x.url === sheetItem.url);
          if (existing) {
            if (sheetItem.scanStatus && existing.scanStatus !== sheetItem.scanStatus) { existing.scanStatus = sheetItem.scanStatus; statusUpdated++; }
          } else if (!isDuplicate(sheetItem, scannedItems)) {
            scannedItems.push({ ...sheetItem, scanStatus: sheetItem.scanStatus || "" });
            added++;
          }
        });
        if (added || statusUpdated) saveScan();
        return { added, statusUpdated };
      }

      async function refreshFromSheet() {
        const btn = document.getElementById("refreshBtn");
        setSyncState("loading", "동기화 중");
        btn.classList.add("spin");
        try {
          const { added, statusUpdated } = await loadEmartItems();
          resetRender();
          const now = new Date();
          setSyncState("ok", `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`);
          if (added || statusUpdated) showToast(`신규 ${added} · 갱신 ${statusUpdated}`, "ok");
        } catch (e) {
          setSyncState("err", "오류");
        } finally {
          btn.classList.remove("spin");
        }
      }
      function setSyncState(st, txt) {
        document.getElementById("syncDot").className = "sync-dot" + (st ? " " + st : "");
        document.getElementById("syncText").textContent = txt;
      }

      /* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
      function esc(s) {
        return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      let _toastT;
      function showToast(msg, type = "") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "toast" + (type ? " " + type : "");
        requestAnimationFrame(() => el.classList.add("show"));
        clearTimeout(_toastT);
        _toastT = setTimeout(() => el.classList.remove("show"), 2600);
      }

      /* ══════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════ */
      document.getElementById("searchInput").addEventListener("input", (e) => {
        state.search = e.target.value;
        resetRender();
      });
      document.getElementById("refreshBtn").addEventListener("click", refreshFromSheet);
      document.getElementById("scanBtn").addEventListener("click", runScan);
      document.getElementById("dedupScanBtn").addEventListener("click", deduplicateExisting);
      document.getElementById("clearScanBtn").addEventListener("click", clearAllScan);
      document.getElementById("blockedAddBtn").addEventListener("click", addBlocked);
      document.getElementById("blockedInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.isComposing) addBlocked();
      });
      document.getElementById("statusTabs").addEventListener("click", (e) => {
        const btn = e.target.closest(".status-tab");
        if (!btn) return;
        state.status = btn.dataset.status;
        resetRender();
      });
      document.getElementById("dateChips").addEventListener("click", (e) => {
        const btn = e.target.closest(".date-chip");
        if (!btn) return;
        setBucket(btn.dataset.bucket || null);
      });

      const sentinelObserver = new IntersectionObserver(
        (entries) => {
          if (!entries[0].isIntersecting || renderCtl.loading) return;
          if (renderCtl.shown >= renderCtl.list.length) return;
          renderCtl.loading = true;
          requestAnimationFrame(() => {
            renderMore();
            renderCtl.loading = false;
          });
        },
        { rootMargin: "600px 0px" }
      );
      sentinelObserver.observe(document.getElementById("scrollSentinel"));

      /* ── 링크 추출기 ─────────────────────────────── */
      async function runExtract() {
        const url = document.getElementById("extractUrlInput").value.trim();
        if (!url) return;
        const statusEl = document.getElementById("extractStatus");
        const resultEl = document.getElementById("extractResult");
        const copyBtn = document.getElementById("extractCopyBtn");
        const toScanBtn = document.getElementById("extractToScanBtn");
        statusEl.textContent = "추출 중";
        resultEl.style.display = "none";
        copyBtn.style.display = "none";
        toScanBtn.style.display = "none";
        try {
          const api = new URL(APPS_SCRIPT_URL);
          api.searchParams.set("action", "extractLinks");
          api.searchParams.set("url", url);
          const res = await fetch(api.toString());
          const json = await res.json();
          if (!json.success) throw new Error(json.error || "추출 실패");
          const links = json.links;
          if (!links.length) { statusEl.textContent = "결과 없음"; return; }
          statusEl.textContent = `${links.length}개`;
          resultEl.textContent = links.join("\n");
          resultEl.style.display = "block";
          copyBtn.style.display = "";
          toScanBtn.style.display = "";
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(links.join("\n"));
            copyBtn.textContent = "복사됨";
            setTimeout(() => { copyBtn.textContent = "전체 복사"; }, 1400);
          };
          toScanBtn.onclick = () => {
            const ta = document.getElementById("scanUrlInput");
            const existing = ta.value.trim();
            ta.value = (existing ? existing + "\n" : "") + links.join("\n");
            document.getElementById("extractSection").removeAttribute("open");
            showToast(`${links.length}개 추가됨`);
          };
        } catch (e) {
          statusEl.textContent = "오류";
        }
      }
      document.getElementById("extractBtn").addEventListener("click", runExtract);

      /* ══════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════ */
      renderBlockedTags();
      resetRender();
      refreshFromSheet();

      /* ── LOCK SCREEN ─────────────────────────────────── */
      (() => {
        const CORRECT = "1111";
        const lock = document.getElementById("lockScreen");
        if (sessionStorage.getItem("unlocked") === "1") { lock.style.display = "none"; return; }
        let pin = "";
        const dots = [0, 1, 2, 3].map((i) => document.getElementById("d" + i));
        const errEl = document.getElementById("lockError");
        function updateDots() {
          dots.forEach((d, i) => { d.classList.toggle("filled", i < pin.length); d.classList.remove("error"); });
          errEl.textContent = "";
        }
        function shake() {
          dots.forEach((d) => d.classList.add("error"));
          errEl.textContent = "비밀번호 오류";
          setTimeout(() => { pin = ""; updateDots(); }, 700);
        }
        function submit() {
          if (pin === CORRECT) { sessionStorage.setItem("unlocked", "1"); lock.style.display = "none"; }
          else shake();
        }
        document.querySelectorAll(".pin-key").forEach((btn) => {
          btn.addEventListener("click", () => {
            const k = btn.dataset.k;
            if (k === "del") { pin = pin.slice(0, -1); updateDots(); return; }
            if (k === "" || pin.length >= 4) return;
            pin += k; updateDots();
            if (pin.length === 4) submit();
          });
        });
        document.addEventListener("keydown", (e) => {
          if (lock.style.display === "none") return;
          if (e.key >= "0" && e.key <= "9" && pin.length < 4) { pin += e.key; updateDots(); if (pin.length === 4) submit(); }
          else if (e.key === "Backspace") { pin = pin.slice(0, -1); updateDots(); }
        });
      })();

      // 북마클릿 href 동적 생성
      (() => {
        const S = encodeURIComponent(APPS_SCRIPT_URL);
        const saveBkmkCode = `(function(){
var S=decodeURIComponent('${S}');
function fld(ks){var rs=document.querySelectorAll('tr');for(var i=0;i<rs.length;i++){var th=rs[i].querySelector('th');var td=rs[i].querySelector('td');if(!th||!td)continue;var t=th.textContent.trim();for(var j=0;j<ks.length;j++){if(t.indexOf(ks[j])>=0)return td.textContent.replace(/\s+/g,' ').trim();}}return '';}
var d={action:'saveToEmart',url:location.href};
d['품명']=fld(['품명 및 모델명','품명','상품명']);
d['제조사수입자']=fld(['제조사/수입자','제조사','수입자']);
d['제조국']=fld(['제조국','원산지']);
d['전화번호']=fld(['A/S 책임자 및 전화번호','고객센터','전화번호']);
d.addedAt=new Date().toISOString();
var u=new URL(S);Object.keys(d).forEach(function(k){u.searchParams.set(k,d[k]);});
var el=document.createElement('div');el.style.cssText='position:fixed;top:20px;right:20px;z-index:99999;background:#111;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-family:sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.5);border:1px solid #333';
el.textContent='저장 중';document.body.appendChild(el);
fetch(u.toString()).then(function(r){return r.json();}).then(function(j){el.style.borderColor=j.success?'#3ddc84':'#f66';el.textContent=j.success?'저장됨: '+(d['품명']||'—'):'오류: '+j.error;setTimeout(function(){el.remove();},2600);}).catch(function(e){el.style.borderColor='#f66';el.textContent='오류: '+e.message;setTimeout(function(){el.remove();},2600);});
})()`;
        const extractBkmkCode = `(function(){
var as=document.querySelectorAll('a[href*="itemView.ssg"]');var ls=[];
as.forEach(function(a){var h=a.href;if(h&&ls.indexOf(h)<0)ls.push(h);});
if(!ls.length){alert('링크 없음');return;}
var t=document.createElement('div');t.style.cssText='position:fixed;top:20px;right:20px;z-index:99999;background:#111;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-family:sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.5);border:1px solid #333';
t.innerHTML=ls.length+'개 복사됨';
document.body.appendChild(t);
if(navigator.clipboard){navigator.clipboard.writeText(ls.join('\n'));}else{var ta=document.createElement('textarea');ta.value=ls.join('\n');ta.style.cssText='position:fixed;top:-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
setTimeout(function(){t.remove();},2600);
})()`;
        const saveBtn = document.getElementById("bkmkSaveBtn");
        const extractBtn = document.getElementById("bkmkExtractBtn");
        if (saveBtn) saveBtn.href = "javascript:" + saveBkmkCode;
        if (extractBtn) extractBtn.href = "javascript:" + extractBkmkCode;
      })();
    </script>
  </body>
